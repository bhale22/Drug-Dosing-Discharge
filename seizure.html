<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seizure Medications — Dosing & Discharge</title>
<style>
:root{
  --bg:#F3F6F6; --surface:#fff; --ink:#16282C; --soft:#5B6E72;
  --line:#E1E8E8; --accent:#0E6E66; --accent-s:#E2F1EE; --accent-d:#0A4F49;
  --warn:#B45309; --warn-s:#FDF3E3; --emerg:#A02C2C; --emerg-s:#FBEDED;
  --r:14px;
  --sans:"Seravek","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ============ header / controls ============ */
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:16px 0 14px;
  position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(22,40,44,.06)}
.bar-inner{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;flex-wrap:wrap;
  align-items:flex-end;gap:14px 26px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eyebrow a{color:var(--accent);text-decoration:none}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.ctl label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:7px 15px;
  border:none;background:var(--surface);color:var(--soft);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.wt-wrap{display:flex;align-items:center;gap:8px}
#wt{font-family:var(--mono);font-size:16px;font-weight:600;width:90px;padding:7px 10px;
  border:1.5px solid var(--line);border-radius:9px 0 0 9px;border-right:none}
.wt-wrap .seg{border-radius:0 9px 9px 0;border-left:none}
.kg-show{font-size:13px;color:var(--soft);font-family:var(--mono)}
.pb-toggle{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  padding:7px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;user-select:none}
.pb-toggle input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}

/* ============ sections ============ */
main{padding:24px 0 30px}
.ladder-strip{background:var(--accent-s);border:1px solid #C8E6E3;border-radius:var(--r);
  padding:13px 18px;margin-bottom:20px;font-size:13.5px;color:var(--accent-d)}
.ladder-strip strong{font-weight:700}
.ladder-strip .arrow{color:var(--accent);font-weight:700;padding:0 6px}

section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:20px}
section.emerg{border-color:#EBC9C9;background:#FFFDFD}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sec-tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent-s);color:var(--accent-d);border-radius:10px;padding:2px 9px}
section.emerg .sec-tag{background:var(--emerg-s);color:var(--emerg)}
.sec-sub{font-size:12.5px;color:var(--soft);margin-bottom:12px}

.tier{margin-top:14px}
.tier-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);
  background:var(--accent-s);border-radius:8px;padding:4px 11px;display:inline-block;margin-bottom:8px}

/* ============ dose table ============ */
table.dose{width:100%;border-collapse:collapse;font-size:13.5px}
table.dose th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soft);font-weight:700;padding:5px 10px 5px 0;border-bottom:1.5px solid var(--line)}
table.dose td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.dose tr:last-child td{border-bottom:none}
td.ck{width:30px;padding-top:11px}
td.ck input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.dname{font-weight:650;font-size:14px}
.dgen{font-size:12px;color:var(--soft)}
.dnote{font-size:11.5px;color:var(--soft);margin-top:2px;max-width:260px}
.drange{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.dfreq{font-size:11.5px;color:var(--soft)}
.target{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-d);white-space:nowrap}
.target small{font-weight:400;color:var(--soft)}

.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:330px}
.chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1.5px solid var(--line);
  border-radius:9px;background:var(--surface);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sel small{color:#D7ECE9}
.chip small{color:var(--soft);font-size:10.5px}
.chip.best:not(.sel){border-color:var(--accent);background:var(--accent-s)}
.nofit{font-size:12px;color:var(--warn);font-weight:600}

/* ============ emergency rows ============ */
.erow{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:none}
.estep{font-size:11px;font-weight:800;color:#fff;background:var(--emerg);border-radius:50%;
  width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.erow.alt .estep{background:var(--warn)}
.ename{font-weight:650;min-width:215px}
.ename .esub{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.edose{font-family:var(--mono);font-size:12.5px;color:var(--soft);min-width:140px}
.evol{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--emerg);min-width:150px}
.erow.alt .evol{color:var(--warn)}
.einstr{font-size:12.5px;color:var(--soft);flex:1;min-width:200px}
.erow td.ck{padding:0}
.erow .ck{flex:none}
.erow input[type=checkbox]{width:16px;height:16px;accent-color:var(--emerg);cursor:pointer;position:relative;top:2px}

/* ============ notes / plan ============ */
.notes{background:#FFFBE8;border:1px solid #EADFA0;border-radius:var(--r);padding:15px 18px;margin-bottom:20px}
.notes h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A6A00;margin-bottom:8px}
.notes div{font-size:13px;margin-bottom:6px}
.notes strong{font-weight:700}

#plan{scroll-margin-top:90px}
.plan-pre{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:60px}
.plan-actions{margin-top:10px;display:flex;gap:8px;align-items:center}
.obtn{font-family:var(--sans);font-size:13px;font-weight:700;padding:7px 16px;border:none;
  border-radius:9px;cursor:pointer;background:var(--accent);color:#fff}
.obtn.s{background:var(--surface);color:var(--accent-d);border:1.5px solid var(--line)}
.copied{font-size:12.5px;font-weight:700;color:var(--accent-d);opacity:0;transition:opacity .3s}
.copied.show{opacity:1}

.countbar{position:fixed;bottom:0;left:0;right:0;background:var(--accent-d);padding:9px 0;z-index:25}
.countbar-inner{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center}
.countbar strong{color:#fff;font-size:13.5px}
.countbar a{color:#fff;font-size:13.5px;font-weight:600}
main{padding-bottom:70px}

footer{padding:16px 0 60px;font-size:11.5px;color:var(--soft)}
footer hr{border:none;border-top:1px solid var(--line);margin-bottom:10px}
@media(max-width:760px){
  .chips{max-width:none}
  table.dose,.drange{font-size:12.5px}
}
@media print{
  header,.countbar,.plan-actions,footer{display:none}
}
</style>
</head>
<body>

<header>
  <div class="bar-inner">
    <div class="titleblock">
      <div class="eyebrow"><a href="index.html">← All Conditions</a></div>
      <h1>⚡ Seizure Medications</h1>
    </div>
    <div class="ctl">
      <label>Species</label>
      <div class="seg" role="group">
        <button id="btn-dog" class="on" onclick="setSp('dog')">Dog</button>
        <button id="btn-cat" onclick="setSp('cat')">Cat</button>
      </div>
    </div>
    <div class="ctl">
      <label>Weight</label>
      <div class="wt-wrap">
        <input id="wt" type="number" inputmode="decimal" min="0" step="0.1" value="60">
        <div class="seg">
          <button id="btn-lb" class="on" onclick="setU('lb')">lb</button>
          <button id="btn-kg" onclick="setU('kg')">kg</button>
        </div>
        <div class="kg-show" id="kgshow"></div>
      </div>
    </div>
    <div class="ctl" id="pbctl">
      <label>Phenobarb status</label>
      <label class="pb-toggle"><input type="checkbox" id="onpb" onchange="render()"> Patient is on phenobarbital</label>
    </div>
  </div>
</header>

<main><div class="wrap" id="main"></div></main>

<div class="countbar">
  <div class="countbar-inner">
    <strong id="selcount">0 medications selected</strong>
    <a href="#plan">↓ Jump to treatment plan</a>
  </div>
</div>

<footer><div class="wrap"><hr>
Internal clinical reference — includes off-label options used at the clinician's discretion.
Verify all doses, concentrations, and label directions before administering or dispensing.
</div></footer>

<script>
"use strict";
/* ================================================================
   DATA — maintenance ladder
   lo/hi = mg/kg per dose. freq = label. perDay = dose is per DAY.
   strengths/splits → tablet-fit chips. unit: tab or cap (caps not split).
================================================================ */
const DOG_TIERS=[
 {h:"Tier 1 — First line: start with ONE of these",
  sub:"Zonisamide or levetiracetam. Pick whichever formulation/size fits the dog best.",
  drugs:[
   {id:"zon",name:"Zonisamide",unit:"capsule",freq:"BID",
    loFn:pb=>pb?10:5,hiFn:pb=>pb?10:5,
    rangeFn:pb=>pb?"10 mg/kg":"5 mg/kg",
    strengths:[25,50,100],splits:[1,2,3],
    note:"On phenobarbital (induces metabolism): 10 mg/kg BID. Not on PB: 5 mg/kg BID."},
   {id:"kep",name:"Levetiracetam (regular)",gen:"Keppra IR",unit:"tablet",freq:"TID",
    lo:20,hi:20,range:"20 mg/kg",strengths:[250,500,750],splits:[0.25,0.5,0.75,1,1.5,2]},
   {id:"kepxr",name:"Levetiracetam XR",gen:"Keppra XR",unit:"tablet",freq:"BID",
    lo:30,hi:30,range:"30 mg/kg",strengths:[500,750],splits:[0.5,1,1.5,2],
    note:"OK to split XR — dissolution studies confirm split tablets keep sustained-release kinetics. Do NOT crush (crushed = immediate release)."},
  ]},
 {h:"Tier 2 — If insufficient alone: ADD the other",
  sub:"Same drugs and doses as Tier 1 — add zonisamide to Keppra or vice versa. Maximize both before Tier 3.",
  drugs:[]},
 {h:"Tier 3 — At max doses of both: add Phenobarbital",
  drugs:[
   {id:"pb",name:"Phenobarbital",unit:"tablet",freq:"BID",
    lo:2.5,hi:5,range:"2.5–5 mg/kg",strengths:[15,30,60],splits:[0.5,1,1.5,2,3,4],
    note:"Target serum level 20–40 µg/ml. Recheck level, CBC, chemistry at 2 weeks then q 6 months. Remember to switch zonisamide to 10 mg/kg."},
  ]},
 {h:"Tier 4 — Further add-ons / alternatives",
  drugs:[
   {id:"kbr",name:"Potassium Bromide",gen:"KBr",unit:null,freq:"SID",perDay:true,
    lo:10,hi:35,range:"10–35 mg/kg/DAY",
    note:"Compounded. 3–4 months to steady state without a load. NOT in cats."},
   {id:"gaba",name:"Gabapentin",unit:"capsule",freq:"TID",
    lo:10,hi:10,range:"10 mg/kg",strengths:[100,300,400],splits:[1,2,3],
    note:"Avoid xylitol-containing liquid preparations."},
   {id:"preg",name:"Pregabalin",unit:"capsule",freq:"BID–TID",
    lo:2,hi:4,range:"2–4 mg/kg",strengths:[25,50,75,100],splits:[1,2,3]},
   {id:"topi",name:"Topiramate",unit:"tablet",freq:"BID",
    lo:5,hi:10,range:"5–10 mg/kg",strengths:[25,50,100],splits:[0.5,1,1.5,2],
    note:"Alternative: 2.5–5 mg/kg TID."},
   {id:"felb",name:"Felbamate",unit:"tablet",freq:"TID",
    lo:15,hi:20,range:"15–20 mg/kg",strengths:[400,600],splits:[0.5,1,1.5,2]},
   {id:"clonaz",name:"Clonazepam",unit:"tablet",freq:"q 8 h",
    lo:0.02,hi:0.07,range:"0.02–0.07 mg/kg",strengths:[0.5,1,2],splits:[0.5,1,1.5,2]},
  ]},
];

const CAT_TIERS=[
 {h:"Tier 1 — First line: Phenobarbital",
  drugs:[
   {id:"pb_c",name:"Phenobarbital",unit:"tablet",freq:"BID",
    lo:2,hi:5,range:"2–5 mg/kg",strengths:[15,30],splits:[0.25,0.5,0.75,1,1.5,2],
    note:"Not hepatotoxic in cats, but may see ~30% increases in ALP & ALT. Target serum level 20–40 µg/ml."},
  ]},
 {h:"Tier 2 — Add Zonisamide",
  drugs:[
   {id:"zon_c",name:"Zonisamide",unit:"capsule",freq:"SID",
    lo:5,hi:10,range:"5–10 mg/kg",strengths:[25,50,100],splits:[1,2]},
  ]},
 {h:"Tier 3 — Add Levetiracetam",
  drugs:[
   {id:"kep_c",name:"Levetiracetam (regular)",gen:"Keppra IR",unit:"tablet",freq:"TID",
    lo:20,hi:20,range:"20 mg/kg",strengths:[250,500],splits:[0.25,0.5,0.75,1]},
  ]},
 {h:"Tier 4 — Further add-ons / alternatives",
  drugs:[
   {id:"clonaz_c",name:"Clonazepam",unit:"tablet",freq:"SID",
    lo:0.016,hi:0.125,range:"0.016–0.125 mg/kg",strengths:[0.5,1,2],splits:[0.25,0.5,1]},
   {id:"topi_c",name:"Topiramate",unit:"tablet",freq:"BID",
    lo:2.4,hi:5,range:"2.4–5 mg/kg",strengths:[25,50,100],splits:[0.25,0.5,1]},
   {id:"felb_c",name:"Felbamate",unit:"tablet",freq:"TID",
    lo:15,hi:20,range:"15–20 mg/kg",strengths:[400,600],splits:[0.25,0.5,1]},
   {id:"cloraz_c",name:"Clorazepate",unit:"tablet",freq:"q 8 h",
    lo:0.5,hi:1,range:"0.5–1 mg/kg",strengths:[3.75,7.5,15],splits:[0.5,1,1.5,2]},
  ]},
];

/* ================================================================
   DATA — active seizure / emergency (conc = mg per ml)
================================================================ */
const DOG_EMERG=[
 {id:"dzp_iv",step:1,name:"Diazepam IV",dose:"0.5–1 mg/kg",lo:0.5,hi:1,conc:5,
  instr:"Repeat if needed."},
 {id:"mdz_in",step:1,alt:true,name:"Intranasal Midazolam",sub:"alternative to IV diazepam",
  dose:"0.2 mg/kg",lo:0.2,hi:0.2,conc:5,instr:"If no IV access."},
 {id:"dzp_r",step:1,alt:true,name:"Rectal / Intranasal Diazepam",sub:"alternative to IV",
  dose:"0.5 mg/kg",lo:0.5,hi:0.5,conc:5,instr:"If no IV access."},
 {id:"pb_iv",step:2,name:"Phenobarbital injectable",sub:"if 2+ seizures after diazepam",
  dose:"2–8 mg/kg",lo:2,hi:8,conc:65,instr:"65 mg/ml injectable. IM acceptable in cats."},
 {id:"kep_iv",step:3,name:"Levetiracetam IV",sub:"may give concurrently with diazepam",
  dose:"40–60 mg/kg",lo:40,hi:60,conc:100,
  instr:"Slow bolus over 5–15 min, diluted 1:1 or 1:10 (saline or D5W). No injectable? Crushed XR Keppra reaches levels within ~30 min."},
];
const DOG_REFRACT=[
 {id:"ket",name:"Ketamine",dose:"1 mg/kg IV, then 1 mg/kg/hr CRI",lo:1,hi:1,conc:100,
  instr:"IV injection, followed by equal volume per hour CRI. Follow with Dexdomitor."},
 {id:"dex",name:"Dexdomitor",dose:"3 µg/kg IV, then 3–7 µg/kg/hr CRI",lo:0.003,hi:0.003,conc:0.5,
  instr:"500 µg/ml. IV injection, followed by equal volume per hour CRI."},
];
const CAT_EMERG=[
 {id:"dzp_iv_c",step:1,name:"Diazepam IV",dose:"0.5–1 mg/kg",lo:0.5,hi:1,conc:5,instr:"Repeat if needed."},
 {id:"pb_iv_c",step:2,name:"Phenobarbital injectable",sub:"if 2+ seizures after diazepam",
  dose:"2–8 mg/kg",lo:2,hi:8,conc:65,instr:"65 mg/ml injectable. IV or IM in cats."},
 {id:"kep_iv_c",step:3,name:"Levetiracetam IV",dose:"40–60 mg/kg",lo:40,hi:60,conc:100,
  instr:"Slow bolus over 5–15 min, diluted 1:1 or 1:10 (saline or D5W)."},
];

/* cluster / pre-ictal (dog) */
const DOG_CLUSTER=[
 {id:"kep_load",name:"Levetiracetam loading dose",gen:"cluster rescue",unit:null,freq:"ONCE",
  lo:60,hi:60,range:"60 mg/kg PO once",
  note:"REGULAR (immediate-release) Keppra only — NOT XR. Then resume maintenance (20 mg/kg TID or 30 mg/kg XR BID). For clustering, not status; skip if already on Keppra."},
 {id:"cloraz",name:"Clorazepate",unit:"tablet",freq:"q 8 h",
  lo:0.5,hi:1,range:"0.5–1 mg/kg",strengths:[3.75,7.5,15],splits:[0.5,1,1.5,2],
  note:"Pre-ictal / cluster prevention. Give 1 mg/kg q 8 h × 2 days after a seizure to prevent clusters. Higher doses as dictated by side effects."},
];

/* ================================================================
   STATE + HELPERS
================================================================ */
let sp="dog",unit="lb";
const S={}; // id -> {on:bool, opt:int|null}
function st(id){if(!S[id])S[id]={on:false,opt:null};return S[id];}
const FRAC={0.25:"¼",0.5:"½",0.75:"¾",1:"1",1.5:"1½",2:"2",2.5:"2½",3:"3",4:"4"};
const fr=n=>FRAC[n]||String(n);
const R2=x=>Math.round(x*100)/100;
const fmtMg=x=>x>=100?String(Math.round(x)):x>=10?String(Math.round(x*10)/10):String(Math.round(x*100)/100);
const fmtMl=x=>(Math.round(x*100)/100).toFixed(2);
function getKg(){const v=parseFloat(document.getElementById("wt").value);
  return(!isFinite(v)||v<=0)?null:(unit==="lb"?v/2.2:v);}
function onPB(){return document.getElementById("onpb").checked;}
function medLo(m){return m.loFn?m.loFn(onPB()):m.lo;}
function medHi(m){return m.hiFn?m.hiFn(onPB()):m.hi;}
function medRange(m){return m.rangeFn?m.rangeFn(onPB()):m.range;}
function allMeds(){
  const tiers=sp==="dog"?DOG_TIERS:CAT_TIERS;
  let out=[];
  for(const t of tiers)out=out.concat(t.drugs);
  if(sp==="dog")out=out.concat(DOG_CLUSTER);
  return out;}
function emergMeds(){return sp==="dog"?DOG_EMERG.concat(DOG_REFRACT):CAT_EMERG;}

/* tablet-fit options: combos of strength × split inside (or nearest to) target */
function fitOptions(m,kg){
  if(!m.strengths||kg===null)return[];
  const lo=medLo(m)*kg,hi=medHi(m)*kg,anchor=lo; // start at the low end of the range
  let inRange=[],all=[];
  for(const s of m.strengths)for(const n of m.splits){
    const mg=s*n,o={s,n,mg};
    all.push(o);
    if(mg>=lo*0.9-1e-9&&mg<=hi*1.1+1e-9)inRange.push(o);
  }
  let opts=inRange.sort((a,b)=>Math.abs(a.mg-anchor)-Math.abs(b.mg-anchor)).slice(0,4);
  if(!opts.length)opts=all.sort((a,b)=>Math.abs(a.mg-anchor)-Math.abs(b.mg-anchor)).slice(0,2);
  // dedupe same total mg keeping the simplest (fewest units, then biggest tab)
  const seen={};const out=[];
  for(const o of opts){const k=o.mg.toFixed(2);
    if(!seen[k]){seen[k]=true;out.push(o);}}
  return out;}

/* ================================================================
   RENDER
================================================================ */
function chipHtml(m,opts,kg){
  const s=st(m.id);
  if(s.opt!==null&&s.opt>=opts.length)s.opt=null;
  const sel=s.opt===null?0:s.opt;
  return opts.map((o,i)=>{
    const cls="chip"+(i===sel?" sel":"")+(i===0?" best":"");
    const mgkg=kg?R2(o.mg/kg):0;
    return'<span class="'+cls+'" onclick="pickOpt(\''+m.id+'\','+i+')">'+
      fr(o.n)+" × "+o.s+" mg <small>= "+fmtMg(o.mg)+" mg · "+mgkg+" mg/kg</small></span>";
  }).join("");}

function drugRow(m,kg){
  const s=st(m.id);
  const lo=kg===null?null:medLo(m)*kg,hi=kg===null?null:medHi(m)*kg;
  const tgt=lo===null?"—":(hi>lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo))+" mg"+(m.perDay?"/day":"");
  const opts=fitOptions(m,kg);
  const chips=m.strengths?
    (opts.length?'<div class="chips">'+chipHtml(m,opts,kg)+'</div>':'<span class="nofit">No single-tablet fit — combine strengths</span>')
    :'<span class="dgen">'+(m.id==="kbr"?"compounded — dose in mg/day":"dose by mg")+'</span>';
  return'<tr>'+
   '<td class="ck"><input type="checkbox" '+(s.on?"checked":"")+' onchange="toggleMed(\''+m.id+'\')"></td>'+
   '<td><div class="dname">'+m.name+(m.gen?' <span class="dgen">· '+m.gen+'</span>':'')+'</div>'+
     (m.note?'<div class="dnote">'+m.note+'</div>':'')+'</td>'+
   '<td><span class="drange">'+medRange(m)+'</span><div class="dfreq">'+m.freq+'</div></td>'+
   '<td><span class="target">'+tgt+'</span>'+(m.perDay?'':'<div class="dfreq">per dose</div>')+'</td>'+
   '<td>'+chips+'</td></tr>';}

function tierHtml(t,kg){
  let inner;
  if(!t.drugs.length){
    inner='<div class="sec-sub" style="margin:0 0 4px 2px">'+(t.sub||"")+'</div>';
  }else{
    inner=(t.sub?'<div class="sec-sub" style="margin-bottom:6px">'+t.sub+'</div>':'')+
    '<table class="dose"><thead><tr><th></th><th>Drug</th><th>Dose range</th><th>Target dose</th><th>Closest tablet fit (click to choose)</th></tr></thead><tbody>'+
    t.drugs.map(m=>drugRow(m,kg)).join("")+'</tbody></table>';}
  return'<div class="tier"><div class="tier-h">'+t.h+'</div>'+inner+'</div>';}

function emergRow(e,kg){
  const s=st(e.id);
  const mgLo=kg===null?null:e.lo*kg,mgHi=kg===null?null:e.hi*kg;
  const vol=mgLo===null?"—":
    (e.hi>e.lo?fmtMl(mgLo/e.conc)+"–"+fmtMl(mgHi/e.conc):fmtMl(mgLo/e.conc))+" ml";
  const mg=mgLo===null?"":(e.hi>e.lo?fmtMg(mgLo)+"–"+fmtMg(mgHi):fmtMg(mgLo))+" mg";
  return'<div class="erow'+(e.alt?" alt":"")+'">'+
   '<span class="ck"><input type="checkbox" '+(s.on?"checked":"")+' onchange="toggleMed(\''+e.id+'\')"></span>'+
   (e.step?'<span class="estep">'+e.step+'</span>':'')+
   '<span class="ename">'+e.name+(e.sub?'<span class="esub">'+e.sub+'</span>':'')+'</span>'+
   '<span class="edose">'+e.dose+'</span>'+
   '<span class="evol">'+vol+'</span>'+
   '<span class="edose">'+mg+'</span>'+
   '<span class="einstr">'+e.instr+'</span></div>';}

function render(){
  const kg=getKg();
  const lb=kg===null?null:kg*2.2;
  document.getElementById("kgshow").innerHTML=unit==="lb"
    ?"= <strong>"+(kg===null?"—":R2(kg))+"</strong> kg"
    :"= <strong>"+(lb===null?"—":Math.round(lb*10)/10)+"</strong> lb";
  document.getElementById("pbctl").style.display=sp==="dog"?"":"none";

  const tiers=sp==="dog"?DOG_TIERS:CAT_TIERS;
  const stripDog='<strong>Dog escalation:</strong> Zonisamide <em>or</em> Keppra'+
    '<span class="arrow">→</span>add the other<span class="arrow">→</span>add Phenobarbital'+
    '<span class="arrow">→</span>add KBr / others';
  const stripCat='<strong>Cat escalation:</strong> Phenobarbital'+
    '<span class="arrow">→</span>add Zonisamide<span class="arrow">→</span>add Keppra'+
    '<span class="arrow">→</span>others';

  let html='<div class="ladder-strip">'+(sp==="dog"?stripDog:stripCat)+'</div>';

  html+='<section><div class="sec-title">Long-term Maintenance <span class="sec-tag">'+(sp==="dog"?"Dog":"Cat")+'</span></div>'+
    '<div class="sec-sub">Dose ranges are per dose unless marked per day. Target dose computed for current weight; tablet chips show the closest real-world fits (best fit highlighted, click to choose for the plan).</div>'+
    tiers.map(t=>tierHtml(t,kg)).join("")+'</section>';

  if(sp==="dog"){
    html+='<section><div class="sec-title">Cluster Prevention / Rescue <span class="sec-tag">Dog</span></div>'+
      '<table class="dose"><thead><tr><th></th><th>Drug</th><th>Dose</th><th>Target dose</th><th>Closest tablet fit</th></tr></thead><tbody>'+
      DOG_CLUSTER.map(m=>drugRow(m,kg)).join("")+'</tbody></table></section>';}

  html+='<section class="emerg"><div class="sec-title">⛑ Active Seizure — Emergency <span class="sec-tag">'+(sp==="dog"?"Dog":"Cat")+'</span></div>'+
    '<div class="sec-sub">Volumes pre-calculated for current weight. Sequence: diazepam → phenobarb if 2+ seizures after diazepam → levetiracetam IV (may be concurrent).</div>'+
    (sp==="dog"?DOG_EMERG:CAT_EMERG).map(e=>emergRow(e,kg)).join("");
  if(sp==="dog"){
    html+='<div class="tier"><div class="tier-h" style="background:var(--emerg-s);color:var(--emerg)">Refractory status epilepticus — alternative</div>'+
      '<div class="sec-sub">IV injections, each followed by an equal volume per hour CRI.</div>'+
      DOG_REFRACT.map(e=>emergRow(e,kg)).join("")+'</div>';}
  html+='</section>';

  html+='<div class="notes"><h3>Clinical Notes</h3>'+
   '<div><strong>XR splitting:</strong> Split XR levetiracetam keeps sustained-release kinetics (dissolution-study confirmed). Crushed XR behaves like immediate release — levels within ~30 min (useful in an emergency).</div>'+
   '<div><strong>Pre-ictal:</strong> Clorazepate 0.5–1 mg/kg q 8 h; may push higher as dictated by side effects.</div>'+
   '<div><strong>Side effects:</strong> Sedation and ataxia are common when starting and typically improve significantly with time.</div>'+
   (sp==="cat"?'<div><strong>Cats:</strong> KBr is NOT recommended (respiratory disease). Phenobarbital is not hepatotoxic in cats but can raise ALP/ALT ~30%.</div>':'')+
   '</div>';

  html+='<section id="plan"><div class="sec-title">Treatment Plan</div>'+
    '<div class="sec-sub">Check medications above — the plan builds itself. Edit freely before copying.</div>'+
    '<div class="plan-pre" id="planout" contenteditable="true" spellcheck="false"></div>'+
    '<div class="plan-actions">'+
    '<button class="obtn" onclick="copyPlan()">Copy plan</button>'+
    '<button class="obtn s" onclick="window.print()">Print / PDF</button>'+
    '<span class="copied" id="copiedmsg">Copied ✓</span></div></section>';

  document.getElementById("main").innerHTML=html;
  buildPlan();}

/* ================================================================
   TREATMENT PLAN
================================================================ */
function planLine(m,kg){
  const s=st(m.id);
  if(m.strengths){
    const opts=fitOptions(m,kg);
    const o=opts[s.opt===null?0:Math.min(s.opt,opts.length-1)];
    if(!o)return m.name+": dose pending.";
    const u=m.unit||"tablet";
    const give=o.n===1?("1 "+u):(fr(o.n)+" "+u+(o.n>1?"s":""));
    return m.name+" "+o.s+" mg: give "+give+" by mouth "+m.freq+
      (kg?" ("+fmtMg(o.mg)+" mg ≈ "+R2(o.mg/kg)+" mg/kg)":"")+"."+
      (m.id==="zon"&&onPB()?" (10 mg/kg target — on phenobarbital.)":"");
  }
  const lo=kg===null?null:medLo(m)*kg,hi=kg===null?null:medHi(m)*kg;
  const amt=lo===null?"___":(hi>lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo));
  return m.name+": "+amt+" mg"+(m.perDay?" per DAY":"")+" "+m.freq+"."+(m.note&&m.id==="kep_load"?" Regular (IR) Keppra only.":"");}

function emergLine(e,kg){
  const mgLo=kg===null?null:e.lo*kg,mgHi=kg===null?null:e.hi*kg;
  const vol=mgLo===null?"___":(e.hi>e.lo?fmtMl(mgLo/e.conc)+"–"+fmtMl(mgHi/e.conc):fmtMl(mgLo/e.conc));
  return e.name+" ("+e.dose+"): "+vol+" ml given in clinic.";}

function buildPlan(){
  const kg=getKg();
  const lb=kg===null?null:Math.round(kg*2.2*10)/10;
  const maint=allMeds().filter(m=>st(m.id).on);
  const emerg=emergMeds().filter(e=>st(e.id).on);
  const n=maint.length+emerg.length;
  document.getElementById("selcount").textContent=n+" medication"+(n===1?"":"s")+" selected";
  const d=new Date();
  let out="SEIZURE PLAN — "+(sp==="dog"?"Canine":"Feline")+" — "+
    (lb===null?"___ lb":lb+" lb ("+R2(kg)+" kg)")+" — "+(d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear()+"\n";
  if(emerg.length){out+="\nGIVEN IN HOSPITAL:\n"+emerg.map(e=>"• "+emergLine(e,kg)).join("\n")+"\n";}
  if(maint.length){out+="\nMEDICATIONS:\n"+maint.map(m=>"• "+planLine(m,kg)).join("\n")+"\n";}
  if(!n)out+="\n(no medications selected)";
  document.getElementById("planout").textContent=out.trim();}

async function copyPlan(){
  const t=document.getElementById("planout").innerText;
  try{await navigator.clipboard.writeText(t);}
  catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";
    a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");
    document.body.removeChild(a);}
  const m=document.getElementById("copiedmsg");
  m.classList.add("show");setTimeout(()=>m.classList.remove("show"),1800);}

/* ================================================================
   EVENTS
================================================================ */
function toggleMed(id){st(id).on=!st(id).on;buildPlan();}
function pickOpt(id,i){const s=st(id);s.opt=i;render();}
function setSp(s){sp=s;
  document.getElementById("btn-dog").classList.toggle("on",s==="dog");
  document.getElementById("btn-cat").classList.toggle("on",s==="cat");
  render();}
function setU(u){
  const wt=document.getElementById("wt");const v=parseFloat(wt.value);
  if(isFinite(v)&&v>0&&u!==unit)wt.value=u==="kg"?R2(v/2.2):Math.round(v*2.2*10)/10;
  unit=u;
  document.getElementById("btn-lb").classList.toggle("on",u==="lb");
  document.getElementById("btn-kg").classList.toggle("on",u==="kg");
  render();}
document.getElementById("wt").addEventListener("input",render);
render();
</script>
