<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seizure Medications — Dosing & Discharge</title>
<style>
:root{
  --bg:#F3F6F6; --surface:#fff; --ink:#16282C; --soft:#5B6E72;
  --line:#E1E8E8; --line2:#EEF2F2; --accent:#0E6E66; --accent-s:#E2F1EE; --accent-d:#0A4F49;
  --warn:#B45309; --warn-s:#FDF3E3; --emerg:#A02C2C; --emerg-s:#FBEDED;
  --r:14px;
  --sans:"Seravek","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* ============ header / controls ============ */
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:14px 0 13px;
  position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(22,40,44,.06)}
.bar-inner{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;flex-wrap:wrap;
  align-items:flex-end;gap:12px 24px}
.titleblock{flex:1 1 220px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eyebrow a{color:var(--accent);text-decoration:none}
.eyebrow a:hover{text-decoration:underline}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.ctl label{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:7px 15px;
  border:none;background:var(--surface);color:var(--soft);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent-d);outline-offset:-2px}
.wt-wrap{display:flex;align-items:center;gap:8px}
#wt{font-family:var(--mono);font-size:16px;font-weight:600;width:90px;padding:7px 10px;
  border:1.5px solid var(--line);border-radius:9px 0 0 9px;border-right:none}
#pname{font-family:var(--sans);font-size:15px;width:140px;padding:7px 10px;
  border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
#wt:focus,#pname:focus{outline:2px solid var(--accent);outline-offset:-1px}
.wt-wrap .seg{border-radius:0 9px 9px 0;border-left:none}
.kg-show{font-size:13px;color:var(--soft);font-family:var(--mono)}

/* ============ sections ============ */
main{padding:22px 0 30px;padding-bottom:96px}
.ladder-strip{background:var(--accent-s);border:1px solid #C8E6E3;border-radius:var(--r);
  padding:13px 18px;margin-bottom:20px;font-size:13.5px;color:var(--accent-d)}
.ladder-strip strong{font-weight:700}
.ladder-strip .arrow{color:var(--accent);font-weight:700;padding:0 6px}

section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:20px}
section.emerg{border-color:#EBC9C9;background:#FFFDFD}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sec-tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--accent-s);color:var(--accent-d);border-radius:10px;padding:2px 9px}
section.emerg .sec-tag{background:var(--emerg-s);color:var(--emerg)}
.sec-sub{font-size:12.5px;color:var(--soft);margin-bottom:12px}

.tier{margin-top:14px}
.tier-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-d);
  background:var(--accent-s);border-radius:8px;padding:4px 11px;display:inline-block;margin-bottom:8px}

/* ============ dose table ============ */
table.dose{width:100%;border-collapse:collapse;font-size:13.5px}
table.dose th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--soft);font-weight:700;padding:5px 10px 5px 0;border-bottom:1.5px solid var(--line)}
table.dose td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.dose tr:last-child td{border-bottom:none}
td.ck{width:30px;padding-top:11px}
td.ck input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.dname{font-weight:650;font-size:14px}
.dgen{font-size:12px;color:var(--soft)}
.dnote{font-size:11.5px;color:var(--soft);margin-top:3px;max-width:270px;line-height:1.45}
.drange{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.dfreq{font-size:11.5px;color:var(--soft)}
.nofit{font-size:12px;color:var(--warn);font-weight:600}

/* ---- adjustable target ---- */
.tgt{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px}
.tgt-in{font-family:var(--mono);font-size:14px;font-weight:600;width:74px;padding:5px 7px;
  border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:right}
.tgt-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tgt.custom .tgt-in{border-color:var(--accent);background:var(--accent-s);color:var(--accent-d)}
.tgt-u{font-size:11px;color:var(--soft)}
.tgt-eq{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-d);white-space:nowrap}
.tgt-reset{font-family:var(--sans);font-size:10.5px;font-weight:700;color:var(--accent-d);
  background:var(--accent-s);border:none;border-radius:20px;padding:4px 9px;cursor:pointer}
.tgt-reset:hover{background:#CDE6E2}
.tgt-lbl{font-size:10.5px;color:var(--soft)}

/* ---- tablet-fit chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:340px}
.chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border:1.5px solid var(--line);
  border-radius:9px;background:var(--surface);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sel small{color:#D7ECE9}
.chip small{color:var(--soft);font-size:10.5px}
.chip.best:not(.sel){border-color:var(--accent);background:var(--accent-s)}
.chip.off{border-style:dashed}
.chip.off small{color:var(--warn)}
.chip.cust{display:inline-flex;align-items:center;gap:5px;cursor:default;border-style:dashed}
.chip.cust.sel{border-style:solid}
.chip.cust input{font-family:var(--mono);font-size:13px;width:84px;padding:3px 6px;border:1.5px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink);text-align:right}
.chip.cust input:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---- inline phenobarb status (lives with the zonisamide dose) ---- */
.pb-inline{margin-top:7px;background:var(--warn-s);border:1.5px solid #EBD9BC;border-radius:10px;
  padding:8px 10px 9px}
.pb-inline .pb-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--warn);margin-bottom:5px}
.pb-seg{display:inline-flex;border:1.5px solid #E3D3B6;border-radius:9px;overflow:hidden;background:#fff}
.pb-seg button{font-family:var(--sans);font-size:12.5px;font-weight:650;padding:7px 11px;
  border:none;background:transparent;color:var(--soft);cursor:pointer}
.pb-seg button.on{background:var(--warn);color:#fff}
.pb-nudge{margin-top:6px;font-size:11.5px;color:var(--warn);font-weight:600;line-height:1.45}
.pb-nudge button{font-family:var(--sans);font-size:11px;font-weight:700;color:#fff;background:var(--warn);
  border:none;border-radius:20px;padding:4px 10px;cursor:pointer;margin-left:5px}

/* ============ emergency rows ============ */
.erow{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:none}
.estep{font-size:11px;font-weight:800;color:#fff;background:var(--emerg);border-radius:50%;
  width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.erow.alt .estep{background:var(--warn)}
.ename{font-weight:650;min-width:215px}
.ename .esub{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.edose{font-family:var(--mono);font-size:12.5px;color:var(--soft);min-width:140px}
.evol{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--emerg);min-width:150px}
.erow.alt .evol{color:var(--warn)}
.einstr{font-size:12.5px;color:var(--soft);flex:1;min-width:200px}
.erow .ck{flex:none}
.erow input[type=checkbox]{width:17px;height:17px;accent-color:var(--emerg);cursor:pointer;position:relative;top:2px}

/* ============ notes ============ */
.notes{background:#FFFBE8;border:1px solid #EADFA0;border-radius:var(--r);padding:15px 18px;margin-bottom:20px}
.notes h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7A6A00;margin-bottom:8px}
.notes div{font-size:13px;margin-bottom:6px}
.notes strong{font-weight:700}

/* ============ output ============ */
#plan{scroll-margin-top:104px}
.tabs{display:flex;gap:5px;margin:10px 0 11px}
.tabs button{font-family:var(--sans);font-size:13px;font-weight:650;padding:7px 15px;
  border:1.5px solid var(--line);border-radius:9px;background:#F7FAFA;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

#blocks{margin-bottom:12px}
.blkhint{font-size:11.5px;color:var(--soft);margin-bottom:8px;line-height:1.5}
.blk{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;
  background:#FAFCFC;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.blk input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin-top:3px;flex:none;cursor:pointer}
.blkwrap{flex:1;min-width:0}
.blktitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--soft);margin-bottom:4px}
.blk textarea{width:100%;font-family:var(--sans);font-size:13px;line-height:1.5;
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;resize:vertical;min-height:52px;
  background:#fff;color:var(--ink)}

.plan-pre{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:60px;outline:none}
.out-dis{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:18px 20px 20px;
  font-size:13.5px;line-height:1.6;color:#111;outline:none}
.out-dis .dis-title{font-size:16px;font-weight:700;margin-bottom:2px}
.out-dis .dis-sub{font-size:12px;color:#666;margin-bottom:12px}
.out-dis .sec-hdr{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);margin:14px 0 5px}
.out-dis ul{list-style:none;padding:0}
.out-dis li{padding:4px 0 4px 16px;border-bottom:1px solid var(--line2);position:relative;line-height:1.5}
.out-dis li:last-child{border-bottom:none}
.out-dis li::before{content:"\2022";position:absolute;left:0;color:var(--accent)}
.out-dis .btext{font-size:13px;line-height:1.6;white-space:pre-wrap;color:#333;margin-top:2px}
.mn-bold{font-weight:700}.mn-desc{color:#555}.mn-give{color:#111}

.plan-actions{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obtn{font-family:var(--sans);font-size:13px;font-weight:700;padding:9px 16px;border:none;
  border-radius:9px;cursor:pointer;background:var(--accent);color:#fff}
.obtn:hover{background:var(--accent-d)}
.obtn.s{background:var(--surface);color:var(--accent-d);border:1.5px solid var(--line)}
.obtn.s:hover{background:#EAF4F2}
.copied{font-size:12.5px;font-weight:700;color:var(--accent-d);opacity:0;transition:opacity .3s}
.copied.show{opacity:1}

/* ============ bottom bar ============ */
.countbar{position:fixed;bottom:0;left:0;right:0;background:var(--accent-d);padding:8px 0;z-index:25}
.countbar-inner{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.countbar strong{color:#fff;font-size:13.5px;flex:1 1 auto}
.cb-actions{display:flex;gap:7px;flex-wrap:wrap}
.cbtn{font-family:var(--sans);font-size:13px;font-weight:700;padding:8px 14px;
  border:1.5px solid rgba(255,255,255,.45);border-radius:9px;background:transparent;
  color:#fff;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:rgba(255,255,255,.14)}
.cbtn.p{background:#fff;color:var(--accent-d);border-color:#fff}
.cbtn.p:hover{background:#EAF4F2}

footer{padding:16px 0 30px;font-size:11.5px;color:var(--soft)}
footer hr{border:none;border-top:1px solid var(--line);margin-bottom:10px}

/* ============ phone ============ */
@media(max-width:760px){
  .wrap{padding:0 12px}
  header{padding:8px 0 10px}
  .bar-inner{padding:0 12px;gap:8px 12px}
  .titleblock{flex:1 1 100%}
  h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-size:10.5px}
  body.scrolled h1{display:none}
  .bar-inner>.ctl{flex:0 0 auto}
  .ctl.name{flex:1 1 100%}
  .ctl.wt{flex:1 1 auto;min-width:0}
  #pname{width:100%;font-size:16px}
  #wt{font-size:16px;width:78px}
  .seg button{padding:9px 13px;font-size:14px}
  .wt-wrap{flex-wrap:wrap}
  .kg-show{flex:1 1 100%;margin-top:3px}
  .chip.cust input{width:84px}
  main{padding:14px 0 30px;padding-bottom:104px}
  section{padding:14px 13px;border-radius:12px}
  .ladder-strip{padding:11px 13px;font-size:13px}

  /* dose table becomes a stack of cards */
  table.dose thead{display:none}
  table.dose,table.dose tbody,table.dose tr,table.dose td{display:block;width:100%}
  table.dose tr{border:1px solid var(--line);border-radius:11px;padding:11px 12px 12px 40px;
    margin-bottom:10px;position:relative}
  table.dose tr:last-child{margin-bottom:0}
  table.dose td{border:none;padding:4px 0}
  table.dose tr:last-child td{border:none}
  td.ck{position:absolute;left:12px;top:12px;width:auto;padding:0}
  td.ck input{width:22px;height:22px}
  table.dose td[data-l]::before{content:attr(data-l);display:block;font-size:9.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
  .dnote{max-width:none}
  .chips{max-width:none}
  .chip{font-size:13px;padding:8px 12px}
  .chip.cust input,.tgt-in{font-size:16px}
  .tgt-in{padding:7px 8px}
  .tgt-reset{padding:6px 11px}

  /* emergency rows stack */
  .erow{gap:3px 12px;padding:12px 0 12px 30px;position:relative}
  .erow .ck{position:absolute;left:0;top:12px}
  .erow input[type=checkbox]{width:22px;height:22px;top:0}
  .ename,.edose,.evol,.einstr{min-width:0;flex:1 1 100%}
  .evol{font-size:16px}

  .tabs button{flex:1;padding:10px 6px}
  .blk textarea{font-size:16px}
  .plan-pre{font-size:12px;padding:12px}
  .out-dis{padding:14px 14px 16px}
  .obtn{flex:1 1 auto;text-align:center;padding:11px 12px}
  .countbar-inner{padding:0 12px;gap:7px}
  .countbar strong{flex:1 1 100%;font-size:12px;order:-1}
  .cb-actions{width:100%}
  .cbtn{flex:1 1 auto;padding:10px 8px;font-size:13px}
  #plan{scroll-margin-top:112px}
}
@media(max-width:400px){
  .cbtn{font-size:12px;padding:9px 5px}
  .countbar strong{font-size:11.5px}
}

/* ============ print =============
   The sheet is cloned into #printroot, a plain static block, and everything
   else is display:none. Printing a position:fixed element repeats it on every
   page in Chrome, which duplicated the instructions several times over. */
#printroot{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff;font-size:11pt}
  body>*{display:none!important}
  body>#printroot{display:block!important}
  #printroot{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.55;
    color:#000;position:static;width:auto}
  #printroot .out-dis{border:none;padding:0;font-size:11pt}
  #printroot ul{list-style:none;padding:0;margin:0}
  #printroot li{padding:3pt 0 3pt 14pt;position:relative;page-break-inside:avoid}
  #printroot li::before{content:"\2022";position:absolute;left:0;color:#000}
  #printroot .dis-title{font-size:16pt;font-weight:bold}
  #printroot .dis-sub{font-size:10pt;color:#555;margin-bottom:10pt}
  #printroot .sec-hdr{font-size:9.5pt;font-weight:bold;text-transform:uppercase;
    letter-spacing:.06em;margin-top:10pt;margin-bottom:3pt;color:#000;page-break-after:avoid}
  #printroot .btext{white-space:pre-wrap;page-break-inside:avoid}
  #printroot pre{font-family:"Courier New",monospace;font-size:10pt;white-space:pre-wrap}
}
</style>
</head>
<body>

<header>
  <div class="bar-inner">
    <div class="titleblock">
      <div class="eyebrow"><a href="index.html">← All Conditions</a></div>
      <h1>⚡ Seizure Medications</h1>
    </div>
    <div class="ctl name">
      <label>Patient name <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input id="pname" type="text" placeholder="Name" autocomplete="off">
    </div>
    <div class="ctl">
      <label>Species</label>
      <div class="seg" role="group">
        <button id="btn-dog" class="on" onclick="setSp('dog')">Dog</button>
        <button id="btn-cat" onclick="setSp('cat')">Cat</button>
      </div>
    </div>
    <div class="ctl wt">
      <label>Weight</label>
      <div class="wt-wrap">
        <input id="wt" type="number" inputmode="decimal" min="0" step="0.1" value="60">
        <div class="seg">
          <button id="btn-lb" class="on" onclick="setU('lb')">lb</button>
          <button id="btn-kg" onclick="setU('kg')">kg</button>
        </div>
        <div class="kg-show" id="kgshow"></div>
      </div>
    </div>
  </div>
</header>

<main><div class="wrap" id="main"></div></main>

<div class="countbar">
  <div class="countbar-inner">
    <strong id="selcount">0 medications selected</strong>
    <div class="cb-actions">
      <button type="button" class="cbtn" onclick="goOutput('plan')">Treatment plan</button>
      <button type="button" class="cbtn p" onclick="goOutput('discharge')">↓ Discharge instructions</button>
    </div>
  </div>
</div>

<div id="printroot"></div>

<footer><div class="wrap"><hr>
Internal clinical reference — includes off-label options used at the clinician's discretion.
Verify all doses, concentrations, and label directions before administering or dispensing.
</div></footer>

<script>
"use strict";
/* ================================================================
   DATA — maintenance ladder
   lo/hi = mg/kg per dose. freq = label. perDay = dose is per DAY.
   strengths/splits → tablet-fit chips. unit: tab or cap (caps not split).
================================================================ */
const DOG_TIERS=[
 {h:"Tier 1 — First line: start with ONE of these",
  sub:"Zonisamide or levetiracetam. Pick whichever formulation/size fits the dog best.",
  drugs:[
   {id:"zon",name:"Zonisamide",unit:"capsule",freq:"BID",pbToggle:true,
    loFn:pb=>pb?10:5,hiFn:pb=>pb?10:5,
    rangeFn:pb=>pb?"10 mg/kg":"5 mg/kg",
    strengths:[25,50,100],splits:[1,2,3],
    note:"On phenobarbital (induces metabolism): 10 mg/kg BID. Not on PB: 5 mg/kg BID."},
   {id:"kep",name:"Levetiracetam (regular)",gen:"Keppra IR",unit:"tablet",freq:"TID",
    lo:20,hi:20,range:"20 mg/kg",strengths:[250,500,750],splits:[0.25,0.5,0.75,1,1.5,2]},
   {id:"kepxr",name:"Levetiracetam XR",gen:"Keppra XR",unit:"tablet",freq:"BID",
    lo:30,hi:30,range:"30 mg/kg",strengths:[500,750],splits:[0.5,1,1.5,2],
    note:"OK to split XR — dissolution studies confirm split tablets keep sustained-release kinetics. Do NOT crush (crushed = immediate release)."},
  ]},
 {h:"Tier 2 — If insufficient alone: ADD the other",
  sub:"Same drugs and doses as Tier 1 — add zonisamide to Keppra or vice versa. Maximize both before Tier 3.",
  drugs:[]},
 {h:"Tier 3 — At max doses of both: add Phenobarbital",
  drugs:[
   {id:"pb",name:"Phenobarbital",unit:"tablet",freq:"BID",
    lo:2.5,hi:5,range:"2.5–5 mg/kg",strengths:[15,30,60],splits:[0.5,1,1.5,2,3,4],
    note:"Target serum level 20–40 µg/ml. Recheck level, CBC, chemistry at 2 weeks then q 6 months. Remember to switch zonisamide to 10 mg/kg."},
  ]},
 {h:"Tier 4 — Further add-ons / alternatives",
  drugs:[
   {id:"kbr",name:"Potassium Bromide",gen:"KBr",unit:null,freq:"SID",perDay:true,

/* ================================================================
   DOSE TARGET + TABLET FITS
   The target defaults to the low end of the labelled range (start low), is
   editable per drug, and the chips bracket it: the closest fit at or below,
   the closest above, and one neighbour either side.
================================================================ */
function labelTarget(m){return medLo(m);}
function curMgkg(m){const s=st(m.id);return s.mgkg!==null?s.mgkg:labelTarget(m);}

/* every total reachable from one strength x one split, ascending, de-duped */
function allFits(m){
  if(!m.strengths)return[];
  const seen={};
  for(const str of m.strengths)for(const n of m.splits){
    const mg=Math.round(str*n*1e4)/1e4,k=mg.toFixed(4);
    if(!seen[k]||n<seen[k].n)seen[k]={s:str,n,mg};}
  return Object.keys(seen).map(k=>seen[k]).sort((a,b)=>a.mg-b.mg);}

function fitOptions(m,kg){
  if(!m.strengths||kg===null)return{opts:[],def:0,target:null};
  const target=curMgkg(m)*kg;
  const all=allFits(m);
  if(!all.length)return{opts:[],def:0,target};
  let i=0;while(i<all.length&&all[i].mg<target-1e-9)i++;
  const under=i-1,over=i<all.length?i:-1;
  const idx=[];
  const push=j=>{if(j>=0&&j<all.length&&idx.indexOf(j)<0)idx.push(j);};
  if(under>=0&&over>=0){push(under-1);push(under);push(over);push(over+1);}
  else if(over<0){push(under-3);push(under-2);push(under-1);push(under);}
  else{push(over);push(over+1);push(over+2);push(over+3);}
  idx.sort((a,b)=>a-b);
  const pick=under<0?over:over<0?under:
    (Math.abs(all[under].mg-target)<=Math.abs(all[over].mg-target)?under:over);
  const lo=medLo(m)*kg,hi=medHi(m)*kg;
  const opts=idx.map(j=>{
    const o=Object.assign({},all[j]);
    o.inRange=o.mg>=lo*0.7-1e-9&&o.mg<=hi*1.4+1e-9;
    o.pct=target>0?Math.round(o.mg/target*100):null;
    return o;});
  return{opts,def:Math.max(0,idx.indexOf(pick)),target,lo,hi};}

/* the option actually in force */
function curFit(m,kg){
  const s=st(m.id),d=fitOptions(m,kg);
  if(s.opt===-1)return{custom:true,mg:s.customMg};
  if(s.opt===null||s.opt<0||s.opt>=d.opts.length)return d.opts[d.def]||null;
  return d.opts[s.opt];}

function targetHtml(m,kg){
  const s=st(m.id),lbl=medRange(m);
  const val=curMgkg(m);
  const unitTxt="mg/kg"+(m.perDay?"/day":"");
  return'<div class="tgt'+(s.mgkg!==null?" custom":"")+'">'+
    '<input class="tgt-in" type="number" step="any" min="0" inputmode="decimal" value="'+val+'" '+
      'aria-label="Target dose for '+escA(m.name)+' in '+unitTxt+'" '+
      'data-act="tgt" data-id="'+m.id+'">'+
    '<span class="tgt-u">'+unitTxt+'</span>'+
    (kg===null?"":'<span class="tgt-eq">= '+fmtMg(val*kg)+' mg</span>')+
    (s.mgkg!==null
      ?'<button type="button" class="tgt-reset" data-act="tgtreset" data-id="'+m.id+'">↺ back to label ('+esc(lbl)+')</button>'
      :'')+
    '</div>';}

function chipsHtml(m,kg){
  const s=st(m.id);
  if(!m.strengths)
    return'<div class="chips"><span class="dgen">'+
      (m.id==="kbr"?"compounded — dose in mg/day":"dose in mg")+'</span>'+customChip(m,kg)+'</div>';
  const d=fitOptions(m,kg);
  if(!d.opts.length)
    return'<div class="chips"><span class="nofit">Enter a weight</span>'+customChip(m,kg)+'</div>';
  const sel=(s.opt===null||s.opt<0||s.opt>=d.opts.length)?d.def:s.opt;
  const chips=d.opts.map((o,i)=>{
    const on=s.opt!==-1&&i===sel;
    const cls="chip"+(on?" sel":"")+(i===d.def?" best":"")+(o.inRange?"":" off");
    const mgkg=kg?R2(o.mg/kg):0;
    return'<span class="'+cls+'" data-act="pick" data-id="'+m.id+'" data-i="'+i+'" '+
      'title="'+fmtMg(o.mg)+' mg = '+(o.pct===null?"?":o.pct)+'% of the '+fmtMg(d.target)+
        ' mg target'+(o.inRange?"":" — well off target")+'">'+
      fr(o.n)+" × "+o.s+" mg <small>= "+fmtMg(o.mg)+" mg · "+mgkg+" mg/kg</small></span>";
  }).join("");
  return'<div class="chips">'+chips+customChip(m,kg)+'</div>';}

function customChip(m,kg){
  const s=st(m.id),on=s.opt===-1;
  return'<span class="chip cust'+(on?" sel":"")+'">Custom '+
    '<input type="number" step="any" min="0" inputmode="decimal" placeholder="amount" '+
      'aria-label="Custom dose for '+escA(m.name)+' in mg" '+
      'value="'+(s.customMg===null?"":s.customMg)+'" '+
      'data-act="cust" data-id="'+m.id+'">'+
    ' mg <small id="cmk-'+m.id+'">'+custMgkg(m,kg)+'</small></span>';}
function custMgkg(m,kg){
  const s=st(m.id);
  return(kg&&s.customMg!==null)?"· "+R2(s.customMg/kg)+" mg/kg":"";}

function drugRow(m,kg){

function tierHtml(t,kg){

    t.drugs.map(m=>drugRow(m,kg)).join("")+'</tbody></table>';}
  return'<div class="tier"><div class="tier-h">'+t.h+'</div>'+inner+'</div>';}

function emergRow(e,kg){
  const s=st(e.id);

    (e.hi>e.lo?fmtMl(mgLo/e.conc)+"–"+fmtMl(mgHi/e.conc):fmtMl(mgLo/e.conc))+" ml";
  const mg=mgLo===null?"":(e.hi>e.lo?fmtMg(mgLo)+"–"+fmtMg(mgHi):fmtMg(mgLo))+" mg";
  return'<div class="erow'+(e.alt?" alt":"")+'">'+
   '<span class="ck"><input type="checkbox" '+(s.on?"checked":"")+
     ' aria-label="Include '+escA(e.name)+'" data-act="tog" data-id="'+e.id+'"></span>'+

   '<span class="edose">'+e.dose+'</span>'+
   '<span class="evol">'+vol+'</span>'+
   '<span class="edose">'+mg+'</span>'+
   '<span class="einstr">'+e.instr+'</span></div>';}

   '<div><strong>Side effects:</strong> Sedation and ataxia are common when starting and typically improve significantly with time.</div>'+
   (sp==="cat"?'<div><strong>Cats:</strong> KBr is NOT recommended (respiratory disease). Phenobarbital is not hepatotoxic in cats but can raise ALP/ALT ~30%.</div>':'')+
   '</div>';

  html+='<section id="plan"><div class="sec-title">Treatment Plan &amp; Discharge</div>'+
    '<div class="sec-sub">Check medications above — both outputs build themselves. Edit freely before copying or printing.</div>'+
    '<div class="tabs">'+
      '<button type="button" id="tab-plan" class="'+(mode==="plan"?"on":"")+'" data-act="mode" data-v="plan">Treatment plan</button>'+
      '<button type="button" id="tab-dis" class="'+(mode==="discharge"?"on":"")+'" data-act="mode" data-v="discharge">Discharge instructions</button>'+
    '</div>'+
    '<div id="blocks"></div>'+
    '<div class="plan-pre" id="planout" contenteditable="true" spellcheck="false"></div>'+
    '<div class="out-dis" id="disout" contenteditable="true" spellcheck="false"></div>'+
    '<div class="plan-actions">'+
    '<button type="button" class="obtn" data-act="copy">Copy</button>'+
    '<button type="button" class="obtn s" data-act="print">Print / PDF</button>'+
    '<span class="copied" id="copiedmsg">Copied ✓</span></div></section>';

  document.getElementById("main").innerHTML=html;
  renderBlocks();
  buildOutput();}

/* ================================================================
   DISCHARGE BLOCK EDITOR
================================================================ */
function renderBlocks(){
  const wrap=document.getElementById("blocks");
  if(!wrap)return;
  if(mode!=="discharge"){wrap.style.display="none";return;}
  wrap.style.display="block";
  wrap.innerHTML='<div class="blkhint">CLIENT INSTRUCTION BLOCKS — check to include, and edit the wording to suit the case. '+
    '"<code>{name}</code>" is replaced by the patient\'s name.</div>'+
    BLOCKS.map(b=>{
      const s=bk(b.id);
      return'<div class="blk">'+
        '<input type="checkbox" '+(s.on?"checked":"")+' aria-label="Include '+escA(b.title)+'" '+
          'data-act="blk" data-id="'+b.id+'">'+
        '<div class="blkwrap"><div class="blktitle">'+esc(b.title)+'</div>'+
        '<textarea rows="3" data-act="blktext" data-id="'+b.id+'">'+
        esc(s.text!==null?s.text:b.text)+'</textarea></div></div>';
    }).join("");}

/* ================================================================
   OUTPUT — plan (record) and discharge (client)
================================================================ */
function fitLine(m,kg){
  const s=st(m.id),o=curFit(m,kg),u=m.unit||"tablet";
  if(o&&o.custom)
    return o.mg===null?m.name+": dose pending — enter a custom amount."
      :m.name+": give "+fmtMg(o.mg)+" mg by mouth "+m.freq+
       (kg?" ("+R2(o.mg/kg)+" mg/kg)":"")+".";
  if(!o)return m.name+": dose pending.";
  const give=o.n===1?("1 "+u):(fr(o.n)+" "+u+(o.n>1?"s":""));
  return m.name+" "+o.s+" mg: give "+give+" by mouth "+m.freq+
    (kg?" ("+fmtMg(o.mg)+" mg ≈ "+R2(o.mg/kg)+" mg/kg)":"")+"."+
    (m.id==="zon"&&onPB()?" (10 mg/kg target — on phenobarbital.)":"");}

function planLine(m,kg){
  const s=st(m.id);
  if(m.strengths)return fitLine(m,kg);
  const how=m.perDay?" total per day, given "+m.freq:" "+m.freq;
  if(s.opt===-1)
    return s.customMg===null?m.name+": dose pending — enter a custom amount."
      :m.name+": "+fmtMg(s.customMg)+" mg"+how+".";
  const t=curMgkg(m),amt=kg===null?"___":fmtMg(t*kg);
  return m.name+": "+amt+" mg"+how+
    (kg?" ("+t+" mg/kg"+(m.perDay?"/day":"")+")":"")+"."+
    (m.id==="kep_load"?" Regular (IR) Keppra only.":"");}

/* ---- client-facing wording: no abbreviations, no mg/kg arithmetic ---- */
const FREQ_CLIENT={"BID":"twice daily","TID":"three times daily","SID":"once daily",
  "QID":"four times daily","BID–TID":"two to three times daily",
  "q 8 h":"every 8 hours","q 12 h":"every 12 hours","ONCE":"one time only"};
function freqClient(f){return FREQ_CLIENT[f]||f;}
function clientLine(m,kg){
  const s=st(m.id),f=freqClient(m.freq);
  if(m.strengths){
    const o=curFit(m,kg);
    if(!o||(o.custom&&o.mg===null))return m.name+": dose to be confirmed by the clinic.";
    if(o.custom)return m.name+": give "+fmtMg(o.mg)+" mg by mouth "+f+".";
    const u=m.unit||"tablet";
    const give=o.n===1?("1 "+u):(fr(o.n)+" "+u+(o.n>1?"s":""));
    return m.name+" "+o.s+" mg: give "+give+" by mouth "+f+".";}
  const per=m.perDay?" total per day":"";
  if(s.opt===-1)
    return s.customMg===null?m.name+": dose to be confirmed by the clinic."
      :m.name+": give "+fmtMg(s.customMg)+" mg"+per+" by mouth "+f+".";
  const amt=kg===null?"___":fmtMg(curMgkg(m)*kg);
  return m.name+": give "+amt+" mg"+per+" by mouth "+f+".";}
function clientEmergLine(e){return e.name+": given here in the hospital today.";}

function emergLine(e,kg){
  const mgLo=kg===null?null:e.lo*kg,mgHi=kg===null?null:e.hi*kg;
  const vol=mgLo===null?"___":(e.hi>e.lo?fmtMl(mgLo/e.conc)+"–"+fmtMl(mgHi/e.conc):fmtMl(mgLo/e.conc));
  return e.name+" ("+e.dose+"): "+vol+" ml given in clinic.";}

function selected(){
  const kg=getKg();
  return{maint:allMeds().filter(m=>st(m.id).on),emerg:emergMeds().filter(e=>st(e.id).on),kg};}

function buildPlan(){
  const {maint,emerg,kg}=selected();
  const lb=kg===null?null:Math.round(kg*2.2*10)/10;
  let out="SEIZURE PLAN — "+(sp==="dog"?"Canine":"Feline")+" — "+
    (lb===null?"___ lb":lb+" lb ("+R2(kg)+" kg)")+" — "+today()+"\n";
  if(sp==="dog")out+="Phenobarbital status: "+(pbOn?"ON phenobarbital":"not on phenobarbital")+"\n";
  if(emerg.length)out+="\nGIVEN IN HOSPITAL:\n"+emerg.map(e=>"• "+emergLine(e,kg)).join("\n")+"\n";
  if(maint.length)out+="\nMEDICATIONS:\n"+maint.map(m=>"• "+planLine(m,kg)).join("\n")+"\n";
  if(!maint.length&&!emerg.length)out+="\n(no medications selected)";
  document.getElementById("planout").textContent=out.trim();}

/* "Name: give X" → bold name, plain instruction, for the client sheet */
function splitLine(line){
  const i=line.indexOf(": ");
  if(i<0)return'<span>'+esc(line)+'</span>';
  return'<span class="mn-bold">'+esc(line.slice(0,i))+'</span><span class="mn-desc">:</span> '+
    '<span class="mn-give">'+esc(line.slice(i+2))+'</span>';}

function buildDischarge(){
  const {maint,emerg,kg}=selected();
  const name=getName();
  const lb=kg===null?null:Math.round(kg*2.2*10)/10;
  const wt=lb===null?"___ lb":lb+" lb ("+R2(kg)+" kg)";
  let h='<div class="dis-title">DISCHARGE INSTRUCTIONS: Seizure Management</div>'+
    '<div class="dis-sub">'+esc(name)+" · "+(sp==="dog"?"Canine":"Feline")+" · "+esc(wt)+" · "+today()+'</div>';
  if(emerg.length)
    h+='<div class="sec-hdr">Treatments performed in hospital</div><ul>'+
      emerg.map(e=>'<li>'+splitLine(clientEmergLine(e))+'</li>').join("")+'</ul>';
  h+='<div class="sec-hdr">Medications to give at home</div>';
  h+=maint.length
    ?'<ul>'+maint.map(m=>'<li>'+splitLine(clientLine(m,kg))+'</li>').join("")+'</ul>'
    :'<ul><li><em>No take-home medications selected</em></li></ul>';
  for(const b of BLOCKS){
    const s=bk(b.id);
    if(!s.on)continue;
    const text=(s.text!==null?s.text:b.text).split("{name}").join(name);
    h+='<div class="sec-hdr">'+esc(b.title)+'</div><div class="btext">'+esc(text)+'</div>';}
  document.getElementById("disout").innerHTML=h;}

function buildOutput(){
  const {maint,emerg}=selected();
  const n=maint.length+emerg.length;
  document.getElementById("selcount").textContent=n+" medication"+(n===1?"":"s")+" selected";
  const plan=document.getElementById("planout"),dis=document.getElementById("disout");
  if(!plan||!dis)return;
  plan.style.display=mode==="plan"?"block":"none";
  dis.style.display=mode==="discharge"?"block":"none";
  if(mode==="plan")buildPlan(); else buildDischarge();}

function activeOut(){return document.getElementById(mode==="plan"?"planout":"disout");}

/* ================================================================
   COPY / PRINT
   Printing clones the active output into a static #printroot; a position:fixed
   print region repeats on every page in Chrome.
================================================================ */
function outToPlain(){
  if(mode==="plan")return document.getElementById("planout").innerText;
  function walk(n){
    if(n.nodeType===3)return n.textContent;
    const t=n.tagName&&n.tagName.toLowerCase(),cl=n.classList;
    if(t==="li")return"• "+[...n.childNodes].map(walk).join("")+"\n";
    if(t==="br")return"\n";
    const inner=[...n.childNodes].map(walk).join("");
    if(cl.contains("dis-sub"))return inner+"\n";
    if(cl.contains("sec-hdr"))return"\n"+inner.toUpperCase()+":\n";
    if(cl.contains("btext"))return inner+"\n";
    if(t==="ul")return"\n"+inner;
    return inner;}
  return walk(document.getElementById("disout")).replace(/\n{3,}/g,"\n\n").trim();}

function flash(){const m=document.getElementById("copiedmsg");
  m.classList.add("show");setTimeout(()=>m.classList.remove("show"),1800);}

async function copyOut(){
  const text=outToPlain();
  if(mode==="discharge"&&navigator.clipboard&&window.ClipboardItem){
    const css="<style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.55;color:#000}"+
      "ul{list-style:none;padding:0;margin:0}li{padding:3pt 0 3pt 14pt;position:relative}"+
      "li::before{content:'• '}.mn-bold{font-weight:bold}"+
      ".sec-hdr{font-size:9.5pt;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;"+
      "margin-top:9pt;margin-bottom:3pt;display:block}"+
      ".dis-title{font-size:14pt;font-weight:bold}.dis-sub{font-size:10pt;color:#555}"+
      ".btext{white-space:pre-wrap}</style>";
    try{
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([css+document.getElementById("disout").innerHTML],{type:"text/html"}),
        "text/plain":new Blob([text],{type:"text/plain"})})]);
      flash();return;
    }catch(e){/* fall through to plain text */}
  }
  try{await navigator.clipboard.writeText(text);}
  catch(e){const a=document.createElement("textarea");a.value=text;a.style.position="fixed";
    a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");
    document.body.removeChild(a);}
  flash();}

function doPrint(){
  const root=document.getElementById("printroot");
  root.innerHTML=mode==="plan"
    ?"<pre>"+esc(document.getElementById("planout").innerText)+"</pre>"
    :'<div class="out-dis">'+document.getElementById("disout").innerHTML+'</div>';
  window.print();}
addEventListener("afterprint",()=>{
  const root=document.getElementById("printroot");
  if(root)root.innerHTML="";});

/* ================================================================
   EVENTS — delegated from #main
================================================================ */
function setMode(m){
  mode=m;
  const tp=document.getElementById("tab-plan"),td=document.getElementById("tab-dis");
  if(tp)tp.classList.toggle("on",m==="plan");
  if(td)td.classList.toggle("on",m==="discharge");
  renderBlocks();buildOutput();}
function goOutput(m){
  setMode(m);
  const el=document.getElementById("plan");
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

function toggleMed(id){st(id).on=!st(id).on;
  if(id==="pb")render(); else buildOutput();}
function pickOpt(id,i){st(id).opt=i;render();}
function setTarget(id,v){
  const s=st(id);
  const n=parseFloat(v);
  if(!isFinite(n)||n<=0)return;
  s.mgkg=Math.round(n*1000)/1000;
  s.opt=null;                       // follow the new target again
  render();}
function resetTarget(id){st(id).mgkg=null;st(id).opt=null;render();}
function setCustom(id,v){
  const s=st(id),n=parseFloat(v);
  s.customMg=(isFinite(n)&&n>0)?Math.round(n*1000)/1000:null;
  s.opt=-1;
  const m=findMed(id),el=document.getElementById("cmk-"+id);
  if(m&&el)el.textContent=custMgkg(m,getKg());
  const chip=el?el.closest(".chip"):null;
  if(chip){
    const row=chip.parentNode;
    [...row.querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel",c===chip));}
  buildOutput();}
function setPB(v){pbOn=!!v;render();}

document.getElementById("main").addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const a=t.dataset.act;
  if(a==="pick")pickOpt(t.dataset.id,+t.dataset.i);
  else if(a==="pb")setPB(+t.dataset.v);
  else if(a==="tgtreset")resetTarget(t.dataset.id);
  else if(a==="mode")setMode(t.dataset.v);
  else if(a==="copy")copyOut();
  else if(a==="print")doPrint();
});
document.getElementById("main").addEventListener("change",e=>{
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const a=t.dataset.act;
  if(a==="tog")toggleMed(t.dataset.id);
  else if(a==="tgt")setTarget(t.dataset.id,t.value);
  else if(a==="blk"){bk(t.dataset.id).on=t.checked;buildOutput();}
});
document.getElementById("main").addEventListener("input",e=>{
  const t=e.target.closest("[data-act]");
  if(!t)return;
  const a=t.dataset.act;
  if(a==="cust")setCustom(t.dataset.id,t.value);
  else if(a==="blktext"){bk(t.dataset.id).text=t.value;buildOutput();}
});
document.getElementById("main").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const t=e.target.closest("[data-act]");
  if(t&&(t.dataset.act==="tgt"||t.dataset.act==="cust")){e.preventDefault();t.blur();}
});

function setSp(s){sp=s;
  document.getElementById("btn-dog").classList.toggle("on",s==="dog");
  document.getElementById("btn-cat").classList.toggle("on",s==="cat");
  render();}
function setU(u){
  const wt=document.getElementById("wt");const v=parseFloat(wt.value);
  if(isFinite(v)&&v>0&&u!==unit)wt.value=u==="kg"?R2(v/2.2):Math.round(v*2.2*10)/10;
  unit=u;
  document.getElementById("btn-lb").classList.toggle("on",u==="lb");
  document.getElementById("btn-kg").classList.toggle("on",u==="kg");
  render();}
document.getElementById("wt").addEventListener("input",render);
document.getElementById("pname").addEventListener("input",buildOutput);

/* compact the sticky header once the page is scrolled (phone) */
let _sc=false;
addEventListener("scroll",()=>{
  const now=window.scrollY>70;
  if(now!==_sc){_sc=now;document.body.classList.toggle("scrolled",now);}
},{passive:true});

render();
</script>
</body>
