name: Build condition index

on:
  push:
    branches: [main]
    paths:
      - "conditions/**.json"
      - "!conditions/index.json"
      - "scripts/build-index.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate conditions/index.json
        run: node scripts/build-index.js

      - name: Commit index if changed
        run: |
          git config user.name "index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add conditions/index.json
          if git diff --cached --quiet; then
            echo "Index unchanged — nothing to commit."
          else
            git commit -m "Auto-build condition index [skip ci]"
            git push
          fi
