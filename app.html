<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosing & Discharge</title>
<style>
/* ===== VARIABLES ===== */
:root{
  --bg:#F3F6F6; --surface:#fff; --ink:#16282C; --soft:#5B6E72;
  --line:#E1E8E8; --line2:#EEF2F2;
  --accent:#0E6E66; --accent-s:#E2F1EE; --accent-d:#0A4F49;
  --warn:#B45309; --warn-s:#FDF3E3;
  --r:12px;
  --sans:"Seravek","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"SF Mono","Cascadia Code","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
body.cat{ --accent:#5B4B8A; --accent-s:#ECE8F5; --accent-d:#41356B; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}

/* ===== TOP BAR ===== */
.bar{position:sticky;top:0;z-index:60;background:var(--surface);
  border-bottom:3px solid var(--accent);box-shadow:0 2px 14px rgba(20,40,44,.08);transition:border-color .25s}
.bar-inner{max-width:1200px;margin:0 auto;padding:11px 22px 13px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 26px}
.titleblock{flex:1 1 220px;min-width:180px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.eyebrow a{color:inherit;text-decoration:none}.eyebrow a:hover{text-decoration:underline}
.back{display:inline-block;font-size:13px;font-weight:700;padding:7px 13px;margin-bottom:5px;
  border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--accent-d);text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--accent);background:var(--accent-s)}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.ctl label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soft);font-weight:600;margin-bottom:4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:#F7FAFA}
.seg button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:7px 15px;
  border:none;background:transparent;color:var(--soft);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--accent);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button:focus-visible{outline:2px solid var(--accent-d);outline-offset:-2px}
#wt{font-family:var(--mono);font-size:16px;font-weight:600;width:90px;padding:7px 10px;
  border:1.5px solid var(--line);border-right:none;border-radius:9px 0 0 9px;background:#fff;color:var(--ink)}
#pname{font-family:var(--sans);font-size:14px;width:130px;padding:7px 10px;
  border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
#wt:focus,#pname:focus{outline:2px solid var(--accent);outline-offset:-1px}
.wt-wrap{display:flex;align-items:stretch}
.kg-show{font-family:var(--mono);font-size:12.5px;color:var(--soft);align-self:center;margin-left:9px}
.kg-show strong{color:var(--ink)}

/* ===== LAYOUT ===== */
main{max-width:1200px;margin:0 auto;padding:22px 22px 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:18px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;min-width:0}
.card.wide{grid-column:1/-1}
.grp-title{font-size:14px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.grp-tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-s);padding:2px 7px;border-radius:20px;transition:background .25s,color .25s}

/* ===== MED ROWS ===== */
.med{border-top:1px solid var(--line);padding:10px 0 9px}
.med:first-of-type{border-top:none;padding-top:1px}
.med:not(.open){padding:7px 0 6px}
.med:not(.open) .mbody{display:none}
.mh{display:flex;align-items:center;gap:9px;min-width:0}

/* one-line summary + disclosure caret */
.msum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;
  cursor:pointer;min-width:0;flex:0 1 auto}
.mfreq{font-size:12px;color:var(--soft);text-align:right}
.chip.dose{background:var(--accent-s);color:var(--accent-d);font-weight:600}
.disc{flex:none;width:28px;height:28px;padding:0;border:none;background:transparent;
  color:var(--soft);cursor:pointer;font-size:13px;line-height:1;border-radius:7px;
  transition:transform .15s,background .15s}
.disc:hover{background:var(--line2);color:var(--ink)}
.disc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.med.open .disc{transform:rotate(180deg)}

/* overview toolbar */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin:0 2px 12px}
.vb-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.vb-btns{display:flex;gap:6px}
.vbtn{font-family:var(--sans);font-size:12.5px;font-weight:650;padding:7px 13px;
  border:1.5px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);cursor:pointer;white-space:nowrap}
.vbtn:hover{border-color:var(--accent);color:var(--accent-d)}
.mh input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin-top:2px;flex:none;cursor:pointer}
.mn{flex:1 1 170px;min-width:0}
.mn .name{font-weight:650;cursor:pointer;font-size:14px}
.mn .gen{color:var(--soft);font-size:12px;margin-left:4px}
.chip{font-family:var(--mono);font-size:12px;color:var(--accent-d);background:var(--accent-s);
  padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;
  align-self:flex-start;transition:background .25s;flex:none}
.chip.dim{background:var(--line2);color:var(--soft)}
/* editable volume chips */
.chip.editable{cursor:text;border:1.5px dashed var(--accent);padding:1px 7px}
.chip.editable:focus{outline:2px solid var(--accent);background:#fff}
.mb{margin:6px 0 0 26px}
.med.off .mb{opacity:.5}
.opt{display:flex;align-items:center;gap:7px;padding:2.5px 0;font-size:13px}
.opt input[type=radio]{accent-color:var(--accent);width:14px;height:14px;flex:none;cursor:pointer}
.opt label{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.opt .dmg{font-family:var(--mono);font-size:12px;color:var(--soft)}
.ltag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--accent);padding:1px 5px;border-radius:10px;transition:background .25s}
.ltag.in{background:var(--accent-s);color:var(--accent-d)}
.ltag.pct,.ltag.out{text-transform:none;letter-spacing:.01em;font-weight:600}
.ltag.out{background:var(--warn-s);color:var(--warn)}
.ltag.pct{background:var(--line2);color:var(--soft)}

/* ===== ADJUSTABLE TARGET + CUSTOM AMOUNT ===== */
.dose-target{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;
  margin:1px 0 7px;font-size:12px;color:var(--soft)}
.dt-lbl{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.dt-in{font-family:var(--mono);font-size:13px;font-weight:600;width:72px;padding:4px 7px;
  border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:right}
.dt-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dose-target.custom .dt-in{border-color:var(--accent);background:var(--accent-s);color:var(--accent-d)}
.dt-unit{font-size:11.5px}
.dt-eq{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600}
.dt-note{font-size:11px}
.dt-reset{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent-d);
  background:var(--accent-s);border:none;border-radius:20px;padding:4px 10px;cursor:pointer}
.dt-reset:hover{background:#CDE6E2}
.opt.cust{gap:6px;margin-top:2px}
.opt.cust label{font-size:13px;color:var(--soft)}
.opt.cust.on label{color:var(--ink);font-weight:650}
.cust-in{font-family:var(--mono);font-size:13px;width:84px;padding:3px 7px;
  border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:right}
.cx{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.cx-u{font-size:12px;color:var(--soft)}
.cust-mg,.cust-hr{font-family:var(--mono);font-size:14px;padding:4px 7px;
  border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:right}
.cust-mg{width:72px}
.cust-hr{width:56px}
.cust-mg:focus,.cust-hr:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cust-n{font-family:var(--mono);font-size:14px;width:60px;padding:4px 7px;
  border:1.5px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:right}
.cust-n:focus{outline:2px solid var(--accent);outline-offset:-1px}

.opt.cust.on .cust-n{border-color:var(--accent)}
.freq-in{font-family:var(--sans);font-size:12.5px;padding:4px 8px;min-width:190px;
  border:1.5px solid var(--accent);border-radius:7px;background:#fff;color:var(--ink)}
.freq-x,.freq-add{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent-d);
  background:var(--accent-s);border:none;border-radius:20px;padding:4px 9px;cursor:pointer;
  margin-left:5px}
.freq-x:hover,.freq-add:hover{background:#CDE6E2}
.freq-one{font-size:12.5px}
.cust-in:focus{outline:2px solid var(--accent);outline-offset:-1px}
.opt.cust.on .cust-in{border-color:var(--accent)}
.cust-u{font-size:11.5px;color:var(--soft)}
.chip.cust{background:var(--accent);color:#fff}
.freq-row{margin-top:5px;font-size:12.5px;color:var(--soft)}
.freq-row select{font-family:var(--sans);font-size:12.5px;padding:2px 5px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--ink)}
.mnote{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.45}
.warn{font-size:12px;color:var(--warn);font-weight:600;margin-top:3px}
details.ch{margin:5px 0 0 26px}
details.ch summary{cursor:pointer;font-size:11.5px;color:var(--soft);font-weight:600}
details.ch table{margin-top:5px;font-size:12.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);
  font-weight:700;padding:4px 8px 4px 0;border-bottom:1.5px solid var(--line)}
td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.hit td{background:var(--accent-s)}
.sc{color:var(--soft)}

/* ===== BOTTOM COUNT BAR ===== */
.countbar{position:sticky;bottom:0;z-index:40;background:var(--accent-d);color:#fff;
  transition:background .25s}
.countbar-inner{max-width:1200px;margin:0 auto;padding:9px 22px;
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.countbar strong{font-size:14px;flex:0 0 auto}
.countbar a{color:#fff;font-size:13.5px;font-weight:600}
.cb-actions{display:flex;gap:7px;flex-wrap:wrap}
.cbtn{font-family:var(--sans);font-size:13px;font-weight:700;padding:8px 14px;
  border:1.5px solid rgba(255,255,255,.45);border-radius:9px;background:transparent;
  color:#fff;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:rgba(255,255,255,.14)}
.cbtn.p{background:#fff;color:var(--accent-d);border-color:#fff}
.cbtn.p:hover{background:#EAF4F2}

/* ===== OUTPUT CARD ===== */
#output{scroll-margin-top:80px}
.tabs{display:flex;gap:5px;margin-bottom:11px}
.tabs button{font-family:var(--sans);font-size:13px;font-weight:650;padding:6px 14px;
  border:1.5px solid var(--line);border-radius:8px;background:#F7FAFA;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* discharge blocks editor */
#blocks{margin-bottom:12px}
.blk{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;
  background:#FAFCFC;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.blk input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin-top:3px;flex:none;cursor:pointer}
.blkwrap{flex:1;min-width:0}
.blktitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--soft);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.blktitle select{font-family:var(--sans);font-size:12px;padding:2px 5px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--ink)}
.blk textarea{width:100%;font-family:var(--sans);font-size:13px;line-height:1.5;
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;resize:vertical;min-height:48px;
  background:#fff;color:var(--ink)}

.outhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 8px}
.outmeta{font-size:12px;color:var(--soft)}
.out-wrap{border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
#outpreview{min-height:180px;padding:18px 20px 20px;background:#fff;font-family:var(--sans);
  font-size:13.5px;line-height:1.6;color:#111;outline:none;cursor:text}
/* record styles */
.out-record .rec-hdr{font-family:var(--mono);font-size:11px;color:var(--soft);
  border-bottom:1.5px solid var(--line);padding-bottom:7px;margin-bottom:9px}
.out-record .sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:12px 0 4px;transition:color .25s}
.out-record ul{list-style:none;padding:0}
.out-record li{padding:4px 0 4px 16px;border-bottom:1px solid var(--line2);position:relative;font-size:13px}
.out-record li:last-child{border-bottom:none}
.out-record li::before{content:"•";position:absolute;left:0;color:var(--accent)}
/* discharge styles — laid out like a printed handout: short lines, clear
   headings, everything under a heading indented beneath it */
.out-dis .dis-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.out-dis .dis-what{font-size:15px;font-weight:600;color:#333;margin-top:1px}
.out-dis .dis-sub{font-size:12.5px;color:#666;margin:6px 0 4px;
  padding-bottom:10px;border-bottom:2px solid var(--line)}
.out-dis .sec-hdr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin:20px 0 7px;padding-bottom:4px;
  border-bottom:1px solid var(--line);transition:color .25s}
.out-dis .sec-body{padding-left:14px}
.out-dis .dmed{margin:0 0 14px}
.out-dis .dmed:last-child{margin-bottom:2px}
.out-dis .dm-line{font-size:14px;line-height:1.45}
.out-dis .dm-name{font-weight:700}
.out-dis .dm-give{font-weight:400}
.out-dis .dm-what{font-size:12.5px;color:#666;line-height:1.4;margin-top:3px;
  padding-left:20px;border-left:3px solid var(--accent-s)}
.out-dis .dp{font-size:13.5px;line-height:1.65;margin:0 0 9px}
.out-dis .dp:last-child{margin-bottom:0}
.out-dis .dbul{display:flex;gap:9px;font-size:13.5px;line-height:1.6;margin:0 0 6px;padding-left:2px}
.out-dis .dbm{color:var(--accent);font-weight:700;flex:none}
.out-dis ul{list-style:none;padding:0}
.out-dis li{padding:4px 0 4px 16px;border-bottom:1px solid var(--line2);position:relative;font-size:13.5px;line-height:1.5}
.out-dis li:last-child{border-bottom:none}
.out-dis li::before{content:"•";position:absolute;left:0;color:var(--accent)}
.out-dis .btext{font-size:13px;line-height:1.6;white-space:pre-wrap;color:#333;margin-top:2px}
/* shared */
.mn-bold{font-weight:700}
.mn-desc{color:#555;font-weight:400}
.mn-give{color:#111}
.out-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding:9px 13px;background:#F7FAFA;border-top:1px solid var(--line)}
.obtn{font-family:var(--sans);font-size:13px;font-weight:700;padding:6px 15px;border:none;
  border-radius:8px;cursor:pointer;transition:background .15s}
.obtn.p{background:var(--accent);color:#fff}.obtn.p:hover{background:var(--accent-d)}
.obtn.s{background:#E8F0EF;color:var(--accent-d)}.obtn.s:hover{background:#D2E6E3}
.copied{font-size:12.5px;font-weight:700;color:var(--accent-d);opacity:0;transition:opacity .3s;margin-left:4px}
.copied.show{opacity:1}

/* ===== PRINT =====
   The sheet is cloned into #printroot (a plain, static block at the end of
   <body>) immediately before printing, and every other top-level element is
   display:none. The previous approach (visibility:hidden + a position:fixed
   #printzone) made Chrome repaint the whole fixed block on every printed
   page, so a two-page discharge sheet came out 3-4 times. */
#printroot{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff;font-size:11pt}
  body>*{display:none!important}
  body>#printroot{display:block!important}
  #printroot{font-family:Arial,Helvetica,sans-serif;font-size:11pt;
    line-height:1.55;color:#000;position:static;width:auto}
  #printroot ul{list-style:none;padding:0;margin:0}
  #printroot li{padding:3pt 0 3pt 14pt;position:relative}
  #printroot li::before{content:"•";position:absolute;left:0}
  .out-dis .dis-title{font-size:18pt;font-weight:bold}
  .out-dis .dis-what{font-size:13pt;font-weight:bold;color:#222;margin-top:1pt}
  .out-dis .dis-sub{font-size:10pt;color:#444;margin:5pt 0 0;
    padding-bottom:6pt;border-bottom:1.5pt solid #999}
  .out-record .rec-hdr{font-size:10pt;color:#444;border-bottom:1pt solid #999;
    padding-bottom:4pt;margin-bottom:8pt}
  .out-dis .sec-hdr,.out-record .sec-lbl{font-size:10pt;font-weight:bold;
    text-transform:uppercase;letter-spacing:.08em;margin:16pt 0 6pt;
    padding-bottom:2pt;border-bottom:.75pt solid #bbb;color:#000}
  .out-dis .sec-body{padding-left:12pt}
  .out-dis .dmed{margin:0 0 11pt}
  .out-dis .dm-line{font-size:11.5pt;line-height:1.4}
  .out-dis .dm-name{font-weight:bold}
  .out-dis .dm-what{font-size:9.5pt;color:#555;line-height:1.35;margin-top:2pt;
    padding-left:14pt;border-left:1.5pt solid #ccc}
  .out-dis .dp{font-size:11pt;line-height:1.6;margin:0 0 7pt}
  .out-dis .dbul{display:flex;gap:7pt;font-size:11pt;line-height:1.55;margin:0 0 5pt}
  .out-dis .dbm{flex:none}
  .out-actions{display:none}
  .out-dis .btext,.out-dis .dmed,.out-dis .dbul,#printroot li{page-break-inside:avoid}
  .out-dis .sec-hdr,.out-record .sec-lbl{page-break-after:avoid}
}

footer{max-width:1200px;margin:0 auto;padding:14px 22px 50px;font-size:11.5px;color:var(--soft)}
footer hr{border:none;border-top:1px solid var(--line);margin-bottom:10px}
.loading{text-align:center;padding:80px 20px;font-size:16px;color:var(--soft)}
/* ===== NO-WEIGHT BANNER ===== */
/* compact, and sitting left of centre where the eye lands after choosing a page */
.wtbar{display:inline-flex;align-items:center;gap:12px 18px;flex-wrap:wrap;
  background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;
  padding:11px 16px;margin:0 2px 16px;color:var(--ink);
  box-shadow:0 2px 12px rgba(14,110,102,.10)}
.wb-txt{display:flex;flex-direction:column;gap:1px;font-size:14px;max-width:300px}
.wb-sub{font-size:12px;font-weight:400;color:var(--soft)}
.wb-in{display:flex;align-items:center;gap:8px}
#wt2{font-family:var(--mono);font-size:20px;font-weight:700;width:104px;padding:7px 10px;
  border:2px solid var(--accent);border-radius:9px;background:#fff;color:var(--ink);text-align:right}
#wt2:focus{outline:3px solid rgba(14,110,102,.35);outline-offset:1px}
.wb-u{font-size:15px;font-weight:700}
.wb-btn{font-family:var(--sans);font-size:14px;font-weight:700;padding:10px 18px;
  border:none;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.wb-btn:hover{background:var(--accent-d)}
.headercalc{display:none}
.headercalc:not([hidden]){display:flex;align-items:baseline;gap:8px;margin-top:8px;

<script>
"use strict";
/* ================================================================
   STATE
================================================================ */
let C=null;          // condition data (loaded JSON)
let sp="dog", unit="lb", mode="record";
const S={};          // per-med: {on, opt, freq, volMl}
const BLK={};        // per-block: {on, dur, text}
function st(id){if(!S[id])S[id]={on:false,opt:null,freq:0,volMl:null,mgkg:null,
  cN:null,cMg:null,cHr:null,cFreq:null,open:false};
  return S[id];}
/* cN x cMg is the custom dose: how many tablets/capsules, of what strength.
   cFreq overrides the frequency list when the clinician types their own. */
/* For a medication with no tablet strength, a custom entry is just an amount
   in that medication's own unit ("1/2 tsp"). */
function customAmount(m){
  const s=st(m.id);
  if(s.opt!==-1||s.cN===null)return"";
  return fr(s.cN)+" "+(m.unitName||"tab")+(s.cN>1&&!m.unitName?"s":"");}
function customTabs(id){
  const s=st(id);
  return(s.cN!==null&&s.cMg!==null)?[{mg:s.cMg,n:s.cN}]:null;}
/* opt: null = follow the target automatically, -1 = custom amount, else index */
function bk(id,def){if(!BLK[id])BLK[id]={on:def.on,dur:0,text:null};return BLK[id];}

/* ================================================================
   HELPERS
================================================================ */
const FRAC={0.0625:"1/16",0.125:"⅛",0.25:"¼",0.5:"½",0.75:"¾",1:"1",1.5:"1½",2:"2",2.5:"2½",3:"3"};
const fr=n=>FRAC[n]||String(n);
const R2=x=>Math.round(x*100)/100;
const fmtMg=x=>{if(x===null)return null;if(x>=100)return Math.round(x).toLocaleString();
  if(x>=10)return String(Math.round(x*10)/10);return String(Math.round(x*100)/100);}
const fmtMl=x=>x===null?null:(Math.round(x*100)/100).toFixed(2);
const TOUCH=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
function today(){const d=new Date();return (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();}
function getKg(){const v=parseFloat(document.getElementById("wt").value);
  return(!isFinite(v)||v<=0)?null:(unit==="lb"?v/2.2:v);}
function getLb(){const k=getKg();return k===null?null:k*2.2;}
function getName(){return document.getElementById("pname").value.trim()||"your pet";}
function band(key,lb){if(!C||!lb)return null;return(C.bands[key]||[]).find(b=>lb>=b.min&&lb<b.max)||null;}
function multiBands(key,lb){if(!C||!lb)return[];return(C.bands[key]||[]).filter(b=>lb>=b.min&&lb<b.max);}
function tabsTotal(tabs){return tabs.reduce((s,t)=>s+t.n*t.mg,0);}
function tabsText(tabs){return tabs.map(t=>t.mg?fr(t.n)+"×"+t.mg+"mg":fr(t.n)+" tab"+(t.n>1?"s":"")).join(" + ");}
function sameTabs(a,b){return a.length===b.length&&a.every((t,i)=>t.mg===b[i].mg&&t.n===b[i].n);}

/* eval-safe function from JSON string — used for protocol chipFn/bodyFn/lineFn */
const fnCache={};
function evalFn(src){if(!fnCache[src])fnCache[src]=new Function("kg","lb","fmtMg","R2",
  "return ("+src+")(kg,lb)");
  return (kg,lb)=>fnCache[src](kg,lb,fmtMg,R2);}

/* ================================================================
   DOSE-OPTIONS ENGINE
   Options are returned ascending by mg and bracket the target: the closest
   fit at-or-below it, the closest above it, and one neighbour either side.
   The clinician can retarget (mg/kg) or type an exact amount instead.
================================================================ */
/* effective mg/kg — the label range unless the clinician retargeted */
function perKg(m){
  const s=st(m.id);
  if(s.mgkg!==null)return{lo:s.mgkg,hi:s.mgkg,custom:true};
  return{lo:m.lo,hi:m.hi,custom:false};}
function labelTarget(m){return m.hi>m.lo?R2((m.lo+m.hi)/2):m.lo;}
function curMgkg(m){const s=st(m.id);return s.mgkg!==null?s.mgkg:labelTarget(m);}

/* every total reachable from one strength x one split, ascending, de-duped
   (a given mg is kept as the fit using the fewest units) */
function allTabOpts(m){
  const seen={};
  for(const str of m.strengths)for(const f of m.splits){
    const mg=Math.round(str*f*1e4)/1e4, k=mg.toFixed(4);
    if(!seen[k]||f<seen[k].tabs[0].n)seen[k]={tabs:[{mg:str,n:f}],mg};}
  return Object.keys(seen).map(k=>seen[k]).sort((a,b)=>a.mg-b.mg);}

/* the pair straddling the target, plus one neighbour on each side.
   When the target sits past one end of the range, the four nearest fits on
   that side are offered instead of wrapping round to a nonsense dose. */
function bracketOpts(all,target){
  if(!all.length)return{opts:[],def:0};
  let i=0;while(i<all.length&&all[i].mg<target-1e-9)i++;
  const under=i-1, over=i<all.length?i:-1;
  const idx=[];
  const push=j=>{if(j>=0&&j<all.length&&idx.indexOf(j)<0)idx.push(j);};
  if(under>=0&&over>=0){push(under-1);push(under);push(over);push(over+1);}
  else if(over<0){push(under-3);push(under-2);push(under-1);push(under);}
  else{push(over);push(over+1);push(over+2);push(over+3);}
  idx.sort((a,b)=>a-b);
  const pick=under<0?over:over<0?under:
    (Math.abs(all[under].mg-target)<=Math.abs(all[over].mg-target)?under:over);
  return{opts:idx.map(j=>({tabs:all[j].tabs,mg:all[j].mg})),
         def:Math.max(0,idx.indexOf(pick))};}

function doseOptions(m,kg,lb){
  if(kg===null)return{opts:[],def:0,msg:"Enter a weight to see dosing options"};
  if(m.type==="multiband"){
    const hits=multiBands(m.bandKey,lb);
    if(!hits.length)return{opts:[],def:0,msg:"Weight outside the dosing chart."};
    return{opts:hits.map(b=>({tabs:b.tabs,mg:tabsTotal(b.tabs),isLabel:true,inRange:true})),
           def:0,msg:""};
  }
  const pk=perKg(m), lo=pk.lo*kg, hi=pk.hi*kg;
  let bandRef=null, bandMsg="";
  if(m.bandKey&&!pk.custom){
    const b=band(m.bandKey,lb);
    if(b&&b.tabs)bandRef=b.tabs;
    else if(b&&!b.tabs)bandMsg="Above chart range — combine tablet strengths.";
    else bandMsg="Below labeled chart range.";
  }
  const target=bandRef?tabsTotal(bandRef):(lo+hi)/2;
  let opts=[],def=0;
  if(m.strengths){
    const br=bracketOpts(allTabOpts(m),target);
    opts=br.opts;def=br.def;
    for(const o of opts){
      o.isLabel=!!(bandRef&&sameTabs(o.tabs,bandRef));
      o.inRange=o.mg>=lo-1e-9&&o.mg<=hi+1e-9;
      o.pct=target>0?Math.round(o.mg/target*100):null;}
    if(bandRef&&!opts.some(o=>o.isLabel)){          // always offer the chart dose
      opts.push({tabs:bandRef,mg:tabsTotal(bandRef),isLabel:true,inRange:true,pct:100});
      opts.sort((a,b)=>a.mg-b.mg);}
    const iLabel=opts.findIndex(o=>o.isLabel);
    if(iLabel>=0)def=iLabel;
    else{
      let best=-1;
      opts.forEach((o,i)=>{if(o.inRange&&
        (best<0||Math.abs(o.mg-target)<Math.abs(opts[best].mg-target)))best=i;});
      if(best>=0)def=best;}
  }else if(bandRef){
    opts=[{tabs:bandRef,mg:tabsTotal(bandRef),isLabel:true,inRange:true}];
  }
  return{opts,def,msg:bandMsg,lo,hi,target,custom:pk.custom};
}

/* which option is in force: explicit pick, custom amount, or the auto default */
function curOpt(m,d){
  const s=st(m.id);
  if(s.opt===-1){
    const tabs=customTabs(m.id);
    return{custom:true,tabs,mg:tabs?tabs[0].mg*tabs[0].n:null};}
  if(s.opt===null||s.opt<0||s.opt>=d.opts.length)return d.opts[d.def]||null;
  return d.opts[s.opt];}

/* ================================================================
   MEDICATION TEXT LINE
   Format: "Name strength (desc):  Give X tab frequency."
================================================================ */
function nameStr(m,tabs){
  if(!tabs||!tabs[0].mg)return m.name;
  return m.name+(tabs.length===1?" "+tabs[0].mg+" mg":" "+tabs.map(t=>t.mg+"mg").join("+"));}
function giveStr(tabs,unit){
  const u=unit||"tab";
  /* a fraction of a tablet is still "half a tab", never "half tabs" */
  if(tabs.length===1){const n=tabs[0].n;return"Give "+fr(n)+" "+u+(n>1?"s":"")+" ";}
  return"Give "+tabs.map(t=>fr(t.n)+"×"+t.mg+"mg").join(" + ")+" ";}
/* The record goes in the chart, so it wants the short form a vet writes:
   "Metronidazole 500 mg: 1/2 tab BID" rather than the client sentence. */
const FREQ_SHORT=[
  [/\bonce daily\b/i,"SID"],[/\btwice daily\b/i,"BID"],
  [/\bthree times daily\b/i,"TID"],[/\bfour times daily\b/i,"QID"],
  [/\bevery other day\b/i,"EOD"],
  [/\bevery (\d+) to (\d+) hours\b/i,"q $1-$2 h"],
  [/\bevery (\d+) hours\b/i,"q $1 h"]];
function shortFreq(f){
  let t=String(f||"");
  for(const [re,rep] of FREQ_SHORT)t=t.replace(re,rep);
  return t.trim();}
function recordLine(m,kg,lb){
  const full=medLine(m,kg,lb);
  /* drop the parenthetical description, keep name + instruction */
  const mt=full.match(/^(.+?)\s+\((?:.+?)\):\s{2}(.+)$/);
  let name=mt?mt[1]:full,give=mt?mt[2]:"";
  if(!mt){const p=full.match(/^(.+?):\s{2}(.+)$/);if(p){name=p[1];give=p[2];}else return full;}
  give=give.replace(/^Give\s+/,"");
  return name+": "+shortFreq(give);}

function curFreq(m){
  const s=st(m.id);
  if(s.opt===-1&&s.cHr!==null)return"every "+s.cHr+(s.cHr==1?" hour":" hours");
  if(s.cFreq!==null&&s.cFreq!=="")return s.cFreq;
  return(m.freqs&&m.freqs.length)?m.freqs[Math.min(s.freq,m.freqs.length-1)]:"";}
function medLine(m,kg,lb){
  const s=st(m.id);
  const freq=curFreq(m);
  const D=m.desc?" ("+m.desc+"):  ":":  ";
  if(m.type==="band"||m.type==="tab"||m.type==="multiband"){
    const d=doseOptions(m,kg,lb);
    const o=curOpt(m,d);
    if(o&&o.custom)return o.tabs===null
      ?m.name+D+"dose pending — enter a custom strength and number."
      :nameStr(m,o.tabs)+D+giveStr(o.tabs,m.unitName)+freq+".";
    if(!o)return m.name+D+"dose pending — weight outside chart range.";
    return nameStr(m,o.tabs)+D+giveStr(o.tabs,m.unitName)+freq+".";
  }
  if(m.type==="calc"){
    const u=m.unitDose||"mg";
    if(s.opt===-1){
      const tabs=customTabs(m.id);
      return tabs===null
        ?m.name+D+"dose pending — enter a custom strength and number."
        :nameStr(m,tabs)+D+giveStr(tabs,m.unitName)+freq+".";}
    const pk=perKg(m);
    const lo=kg===null?null:pk.lo*kg,hi=kg===null?null:pk.hi*kg;
    const amt=lo===null?"___":(pk.hi>pk.lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo));
    return m.name+D+"Give "+amt+" "+u+" "+freq+".";
  }
  if(m.type==="inj"){
    const mg=kg===null?null:m.lo*kg,ml=mg===null?null:mg/m.conc;
    return m.name+D+(ml===null?"___":fmtMl(ml))+" ml "+m.route+" given in clinic.";
  }
  if(m.type==="injVolume"){
    const vol=s.volMl!==null?s.volMl:m.defaultMl;
    return m.name+D+vol+" ml given in clinic.";
  }
  if(m.type==="fixed"){
    const cu=customAmount(m);
    return m.name+(m.strengthLabel?" "+m.strengthLabel:"")+D+"Give "+
      (cu||m.doseText)+(freq?" "+freq:"")+"."+(m.extra?" "+m.extra:"");}
  if(m.type==="weightText"){
    const b=band(m.bandKey,lb),cu=customAmount(m);
    return m.name+D+"Give "+(cu||(b?b.text:"chart amount"))+
      (m.onFood?" on food":"")+(freq?" "+freq:"")+".";
  }
  if(m.type==="iver"){
    const ml=kg===null?"___":fmtMl(kg*m.doseMid/m.conc);
    return "Ivermectin 1% — "+m.name+D+"Give "+ml+" ml ("+m.doseMid+" mg/kg) "+m.protocol+".";
  }
  if(m.type==="protocol")return m.name+D+evalFn(m.lineFn)(kg,lb);
  return "";
}

function splitLine(line){
  const m=line.match(/^(.+?)\s+\((.+?)\):\s{2}(.+)$/);
  if(m)return'<span class="mn-bold">'+esc(m[1])+'</span> <span class="mn-desc">('+esc(m[2])+
    '):</span>  <span class="mn-give">'+esc(m[3])+'</span>';
  const p=line.match(/^(.+?):\s{2}(.+)$/);
  if(p)return'<span class="mn-bold">'+esc(p[1])+':</span>  <span class="mn-give">'+esc(p[2])+'</span>';
  return"<span>"+esc(line)+"</span>";}

function buildRecord(kg,lb,inhosp,atHome){
  const wt=lb===null?"___ lb":(Math.round(lb*10)/10)+" lb ("+R2(kg)+" kg)";
  const hdr=C.code+" — "+(sp==="dog"?"Canine":"Feline")+" — "+wt+" — "+today();
  let html='<div class="out-record"><div class="rec-hdr">'+esc(hdr)+'</div>';
  if(inhosp.length){
    html+='<div class="sec-lbl">Treatments given in hospital</div><ul>'+
      inhosp.map(m=>'<li>'+splitLine(recordLine(m,kg,lb))+'</li>').join("")+'</ul>';}
  if(atHome.length){
    html+='<div class="sec-lbl">Take-home medications</div><ul>'+
      atHome.map(m=>'<li>'+splitLine(recordLine(m,kg,lb))+'</li>').join("")+'</ul>';}
  if(!inhosp.length&&!atHome.length)
    html+='<ul><li><em>No medications selected</em></li></ul>';
  return html+'</div>';}

/* Client-facing prose: break it into short paragraphs and indented bullets so
   an owner is never handed a wall of text. A line starting with • or - becomes
   a bullet; a blank line starts a new paragraph. */
function proseHtml(text){
  const out=[];
  let para=[];
  const flush=()=>{if(para.length){out.push('<p class="dp">'+esc(para.join(" "))+'</p>');para=[];}};
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim();
    if(!line){flush();continue;}
    if(/^[•\-\*]\s+/.test(line)){
      flush();
      out.push('<div class="dbul"><span class="dbm">•</span><span>'+
        esc(line.replace(/^[•\-\*]\s+/,""))+'</span></div>');
      continue;}
    para.push(line);}
  flush();
  return out.join("");}

/* One medication, set out like a label: what it is, then what to do, indented. */
/* Owners should not be handed "BID", so the client sheet turns the sheet's
   abbreviations back into words at display time. */
const FREQ_LONG=[
  [/\bSID\b/g,"once daily"],[/\bBID\b/g,"twice daily"],
  [/\bTID\b/g,"three times daily"],[/\bQID\b/g,"four times daily"],
  [/\bEOD\b/g,"every other day"],
  [/\bq (\d+)-(\d+) h(?:rs?)?\b/gi,"every $1 to $2 hours"],
  [/\bq (\d+) h(?:rs?)?\b/gi,"every $1 hours"],
  [/\bPO\b/g,"by mouth"],[/\bper DAY\b/g,"per day"]];
function longFreq(t){
  let r=String(t||"");
  for(const [re,rep] of FREQ_LONG)r=r.replace(re,rep);
  return r;}

function dischargeMed(m,kg,lb){
  const line=longFreq(medLine(m,kg,lb));
  const mt=line.match(/^(.+?)\s+\((.+?)\):\s{2}(.+)$/);
  const cap=t=>esc(t.charAt(0).toUpperCase()+t.slice(1));
  /* Drug, strength and directions read as one line; the description sits
     indented underneath so each drug stands out. */
  const row=(name,give)=>'<div class="dm-line"><span class="dm-name">'+esc(name)+
    ':</span> <span class="dm-give">'+cap(give)+'</span></div>';
  if(mt)return'<div class="dmed">'+row(mt[1],mt[3])+
    '<div class="dm-what">'+esc(mt[2])+'</div></div>';
  const p=line.match(/^(.+?):\s{2}(.+)$/);
  if(p)return'<div class="dmed">'+row(p[1],p[2])+'</div>';
  return'<div class="dmed"><div class="dm-line"><span class="dm-name">'+
    esc(line)+'</span></div></div>';}

function buildDischarge(kg,lb,inhosp,atHome){
  const name=getName();
  const wt=lb===null?"___ lb":(Math.round(lb*10)/10)+" lb ("+R2(kg)+" kg)";
  const sp2=sp==="dog"?"Canine":"Feline";
  let html='<div class="out-dis">'+
    '<div class="dis-title">Discharge Instructions</div>'+
    '<div class="dis-what">'+esc(C.discharge)+'</div>'+
    '<div class="dis-sub">'+esc(name)+" · "+sp2+" · "+esc(wt)+" · "+today()+'</div>';

  if(inhosp.length){
    html+='<div class="sec-hdr">What we did today</div><div class="sec-body">'+
      inhosp.map(m=>dischargeMed(m,kg,lb)).join("")+'</div>';}

  html+='<div class="sec-hdr">Medications to give at home</div><div class="sec-body">';
  html+=atHome.length
    ?atHome.map(m=>dischargeMed(m,kg,lb)).join("")
    :'<p class="dp"><em>No take-home medications.</em></p>';
  html+='</div>';

  /* Feeding blocks used to print with a tick box; they are plain instructions now. */
  const fed=(C.dischargeBlocks||[]).filter(b=>b.checkbox&&bk(b.id,b).on);
  if(fed.length){
    html+='<div class="sec-hdr">Food and water</div><div class="sec-body">';
    for(const b of fed){
      const bs=bk(b.id,b);
      let text=bs.text!==null?bs.text:b.text;
      if(b.durationOptions){
        const dur=b.durationOptions[Math.min(bs.dur,b.durationOptions.length-1)];
        text=text.replace("{duration}",dur);}
      html+=proseHtml(text.replaceAll("{name}",name));}
    html+='</div>';}

  for(const b of (C.dischargeBlocks||[]).filter(x=>!x.checkbox&&bk(x.id,x).on)){
    const bs=bk(b.id,b);
    const text=(bs.text!==null?bs.text:b.text).replaceAll("{name}",name);
    html+='<div class="sec-hdr">'+esc(b.title)+'</div>'+
          '<div class="sec-body">'+proseHtml(text)+'</div>';}
  return html+'</div>';}

function buildOutput(){
  const kg=getKg(),lb=getLb();
  const sel=C.meds.filter(m=>m.sp===sp&&st(m.id).on);
  const count=document.getElementById("selcount");
  if(count)count.textContent=
    sel.length+" medication"+(sel.length===1?"":"s")+" selected";
  const pv=document.getElementById("outpreview");
  if(!pv)return;
  const inhosp=sel.filter(m=>m.inClinic);
  const atHome=sel.filter(m=>!m.inClinic);
  const html=mode==="record"?buildRecord(kg,lb,inhosp,atHome):buildDischarge(kg,lb,inhosp,atHome);
  pv.innerHTML=html;}

/* ================================================================
   PLAIN-TEXT SERIALISER (walks live DOM)
================================================================ */
function previewToPlain(){
  function walk(n){
    if(n.nodeType===3)return n.textContent;
    const t=n.tagName&&n.tagName.toLowerCase();
    const cl=n.classList;
    if(t==="li")return"• "+[...n.childNodes].map(walk).join("")+"\n";
    if(t==="br")return"\n";
    const inner=[...n.childNodes].map(walk).join("");
    if(cl.contains("rec-hdr"))return inner+"\n";
    if(cl.contains("dis-title")||cl.contains("dis-what"))return inner+"\n";
    if(cl.contains("dis-sub"))return inner+"\n";
    if(cl.contains("sec-hdr")||cl.contains("sec-lbl"))return"\n"+inner.toUpperCase()+"\n";
    if(cl.contains("dm-line"))return"  "+inner.trim()+"\n";
    if(cl.contains("dm-what"))return"      "+inner.trim()+"\n";
    if(cl.contains("dmed"))return inner+"\n";
    if(cl.contains("dbul"))return"  • "+inner.replace(/^•\s*/,"").trim()+"\n";
    if(cl.contains("dp"))return"  "+inner+"\n";
    if(cl.contains("btext"))return inner+"\n";
    if(t==="ul")return"\n"+inner;
    return inner;
  }
  return walk(document.getElementById("outpreview")).replace(/\n{3,}/g,"\n\n").trim();}

/* ================================================================
   COPY / PRINT
================================================================ */
/* Clone the live preview into a static #printroot so the browser lays it out
   as ordinary page flow. Anything position:fixed repeats on every printed
   page in Chrome, which is what duplicated the sheet 3-4 times. */
function doPrint(){
  const root=document.getElementById("printroot");
  root.innerHTML=document.getElementById("outpreview").innerHTML;
  window.print();}
window.addEventListener("afterprint",()=>{
  const root=document.getElementById("printroot");
  if(root)root.innerHTML="";});
function flash(){const m=document.getElementById("copiedmsg");
  m.classList.add("show");setTimeout(()=>m.classList.remove("show"),1800);}
async function copyRich(){
  const el=document.getElementById("outpreview");
  const css="<style>body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.55;color:#000}"+
    "ul{list-style:none;padding:0;margin:0}li{padding:3pt 0 3pt 14pt;position:relative}"+
    "li::before{content:'• '}.mn-bold{font-weight:bold}"+
    ".sec-hdr,.sec-lbl{font-size:9.5pt;font-weight:bold;text-transform:uppercase;"+
    "letter-spacing:.06em;margin-top:9pt;margin-bottom:3pt;display:block}"+
    ".dis-title{font-size:14pt;font-weight:bold}.dis-sub{font-size:10pt;color:#555}"+
    ".rec-hdr{font-size:10pt;color:#555;border-bottom:1px solid #ccc;padding-bottom:4pt;margin-bottom:6pt}"+
    ".btext{white-space:pre-wrap}.dis-what{font-size:12pt;font-weight:bold}"+
    ".sec-body{padding-left:12pt}.dmed{margin:0 0 9pt}"+
    ".dm-name{font-weight:bold}.dm-what{font-size:9.5pt;color:#555;padding-left:14pt}"+
    ".dm-line{font-size:11.5pt}"+
    ".dp{margin:0 0 7pt}.dbul{margin:0 0 5pt;padding-left:12pt}</style>";
  const hb=new Blob([css+el.innerHTML],{type:"text/html"});
  const tb=new Blob([previewToPlain()],{type:"text/plain"});
  try{await navigator.clipboard.write([new ClipboardItem({"text/html":hb,"text/plain":tb})]);flash();}
  catch(e){const r=document.createRange();r.selectNodeContents(el);
    const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    document.execCommand("copy");s.removeAllRanges();flash();}}
async function copyPlain(){
  const t=previewToPlain();
  try{await navigator.clipboard.writeText(t);}
  catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";
    a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");
    document.body.removeChild(a);}
  flash();}

function chipHtml(m,kg,lb){
  if(m.type==="calc"){
    const s=st(m.id),pk=perKg(m),ct=customTabs(m.id);
    if(s.opt===-1)return'<span class="chip'+(ct===null?" dim":" cust")+'">'+
      (ct===null?"custom —":fmtMg(ct[0].mg*ct[0].n)+(m.unitDose?" "+m.unitDose:" mg"))+'</span>';
    const lo=kg===null?null:pk.lo*kg,hi=kg===null?null:pk.hi*kg;
    const t=lo===null?"—":(pk.hi>pk.lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo))+(m.unitDose?" "+m.unitDose:" mg");
    return'<span class="chip'+(lo===null?" dim":"")+(pk.custom?" cust":"")+'">target '+t+'</span>';}
  if(m.type==="inj"){
    const mg=kg===null?null:m.lo*kg,ml=mg===null?null:mg/m.conc;
    return'<span class="chip'+(ml===null?" dim":"")+'">'+(ml===null?"—":fmtMl(ml)+" ml "+m.route)+'</span>';}
  if(m.type==="injVolume"){
    const s=st(m.id);
    const vol=s.volMl!==null?s.volMl:m.defaultMl;
    return'<span class="chip editable" contenteditable="true" inputmode="decimal" '+
      'title="Click to edit volume" '+
      'onblur="setVol(\''+m.id+'\',this)" '+
      'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+vol+'</span> ml';}
  if(m.type==="band"||m.type==="tab"){
    const s=st(m.id),pk=perKg(m),ct=customTabs(m.id);
    if(s.opt===-1)return'<span class="chip'+(ct===null?" dim":" cust")+'">'+
      (ct===null?"custom —":fmtMg(ct[0].mg*ct[0].n)+" mg")+'</span>';
    const lo=kg===null?null:pk.lo*kg,hi=kg===null?null:pk.hi*kg;
    const t=lo===null?"—":(pk.hi>pk.lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo))+" mg";
    return'<span class="chip'+(lo===null?" dim":"")+(pk.custom?" cust":"")+'">target '+t+'</span>';}
  if(m.type==="weightText"){
    const b=band(m.bandKey,lb);
    return'<span class="chip'+(b?"":" dim")+'">'+(b?b.text:"—")+'</span>';}
  if(m.type==="fixed")return'<span class="chip">'+m.doseText+'</span>';
  if(m.type==="iver"){
    const ml=kg===null?null:fmtMl(kg*m.doseMid/m.conc);
    return'<span class="chip'+(ml===null?" dim":"")+'">'+(ml===null?"—":ml+" ml")+'</span>';}
  if(m.type==="protocol")return'<span class="chip'+(kg===null?" dim":"")+'">'+
    (kg===null?"—":evalFn(m.chipFn)(kg,lb))+'</span>';
  if(m.type==="multiband"){
    const hits=multiBands(m.bandKey,lb);
    return'<span class="chip'+(hits.length?"":" dim")+'">'+(hits.length?"see chart":"—")+'</span>';}
  return"";}

function freqHtml(m,s){
  const custom=s.cFreq!==null;
  const box='<input class="freq-in" type="text" placeholder="e.g. twice daily for 5 days" '+
    'aria-label="Custom frequency" value="'+escAttr(s.cFreq||"")+'" '+
    'oninput="setCustomFreq(\''+m.id+'\',this.value)" '+
    'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
    '<button type="button" class="freq-x" title="Back to the standard list" '+
    'onclick="setCustomFreq(\''+m.id+'\',null)">↺</button>';
  if(!m.freqs||!m.freqs.length||m.freqs[0]===""){
    return'<div class="freq-row">'+(custom?box
      :'<button type="button" class="freq-add" onclick="setCustomFreq(\''+m.id+'\',\'\')">'+
       '+ how often</button>')+'</div>';}
  if(s.freq>=m.freqs.length)s.freq=0;
  const sel=m.freqs.length===1
    ?'<span class="freq-one">'+esc(m.freqs[0])+'</span>'
    :'<select onchange="pickFreq(\''+m.id+'\',this.selectedIndex)">'+
      m.freqs.map((f,i)=>'<option '+(s.freq===i?"selected":"")+'>'+esc(f)+'</option>').join("")+
      '</select>';
  return'<div class="freq-row">'+(custom?box
    :sel+' <button type="button" class="freq-add" onclick="setCustomFreq(\''+m.id+'\',\'\')">'+
     'edit</button>')+'</div>';}

function bandChartHtml(m,lb){
  if(!m.bandKey)return"";
  const rows=C.bands[m.bandKey]||[];
  const hits=multiBands(m.bandKey,lb).concat(band(m.bandKey,lb)?[band(m.bandKey,lb)]:[]);
  const cols=m.chartCols||["Weight","Dose"];
  const fields=m.chartRowFields||["lb","text"];
  return'<details class="ch"><summary>Full chart</summary><table><thead><tr>'+
    cols.map(c=>"<th>"+c+"</th>").join("")+'</tr></thead><tbody>'+
    rows.map(b=>'<tr'+(hits.includes(b)?' class="hit"':"")+'>'+
      fields.map((f,i)=>'<td'+(i===0?' class="sc"':"")+'>'+
        (f==="mg_fmt"?(b.mg?b.mg.toLocaleString()+" mg":"—"):
         f==="tabs"?(b.tabs?tabsText(b.tabs):"Combine strengths"):
         (b[f]||""))+'</td>').join("")+'</tr>').join("")+
    '</tbody></table>'+(m.chartNote?'<div class="mnote">'+m.chartNote+'</div>':"")+'</details>';}

/* ================================================================
   COLLAPSED ROW — name + the dose that would actually be given
================================================================ */
/* The dose as the source states it, independent of any patient: this is what a
   quick lookup is actually after, so it is shown whether or not a weight has
   been entered. */
function labelDose(m){
  const u=m.unitDose||"mg";
  if(m.type==="band"||m.type==="tab"||m.type==="calc"||m.type==="multiband"){
    if(m.lo===undefined)return"";
    return(m.hi>m.lo?m.lo+"\u2013"+m.hi:String(m.lo))+" "+u+"/kg"+(m.perDay?"/day":"");}
  if(m.type==="inj")return m.lo+" mg/kg "+(m.route||"");
  if(m.type==="iver")return m.doseMid+" mg/kg";
  if(m.type==="fixed")return m.doseText||"";
  if(m.type==="weightText"){
    /* no weight yet: show the chart's own values so the page is still useful */
    const rows=(C.bands&&C.bands[m.bandKey])||[];
    const seen=[];
    for(const b of rows)if(b.text&&seen.indexOf(b.text)<0)seen.push(b.text);
    const joined=seen.join(" / ");
    return joined.length<=40?joined:"by weight \u2014 see chart";}
  if(m.type==="injVolume")return(m.defaultMl!==undefined?m.defaultMl+" ml":"");
  return"";}

function doseSummary(m,kg,lb){
  const s=st(m.id);
  const freq=(s.opt===-1&&s.cHr!==null)?"every "+s.cHr+(s.cHr==1?" hour":" hours")
    :(s.cFreq!==null&&s.cFreq!=="")?s.cFreq
    :(m.freqs&&m.freqs.length&&m.freqs[0]!=="")?m.freqs[Math.min(s.freq,m.freqs.length-1)]:"";
  let dose="—",dim=true;
  if(m.type==="band"||m.type==="tab"||m.type==="multiband"){
    const d=doseOptions(m,kg,lb),o=curOpt(m,d);
    if(o&&o.custom){dim=o.tabs===null;
      dose=dim?"custom":tabsText(o.tabs)+" = "+fmtMg(o.mg)+" mg";}
    else if(o){dim=false;dose=tabsText(o.tabs)+(o.mg?" = "+fmtMg(o.mg)+" mg":"");}
  }else if(m.type==="calc"){
    const u=m.unitDose||"mg",ct=customTabs(m.id);
    if(s.opt===-1){dim=ct===null;
      dose=dim?"custom":tabsText(ct)+" = "+fmtMg(ct[0].mg*ct[0].n)+" "+u;}
    else if(kg!==null){const pk=perKg(m);dim=false;
      dose=(pk.hi>pk.lo?fmtMg(pk.lo*kg)+"–"+fmtMg(pk.hi*kg):fmtMg(pk.lo*kg))+" "+u;}
  }else if(m.type==="inj"){
    if(kg!==null){dim=false;dose=fmtMl(m.lo*kg/m.conc)+" ml "+m.route;}
  }else if(m.type==="injVolume"){
    dim=false;dose=(s.volMl!==null?s.volMl:m.defaultMl)+" ml";
  }else if(m.type==="fixed"){dim=false;dose=customAmount(m)||m.doseText;
  }else if(m.type==="weightText"){const cu=customAmount(m),b=band(m.bandKey,lb);
    if(cu){dim=false;dose=cu;}else if(b){dim=false;dose=b.text;}
  }else if(m.type==="iver"){
    if(kg!==null){dim=false;dose=fmtMl(kg*m.doseMid/m.conc)+" ml";}
  }else if(m.type==="protocol"){
    if(kg!==null){dim=false;dose=evalFn(m.chipFn)(kg,lb);}}
  return{dose,freq,dim};}

/* The bracketed tablet choices, one tap each, right on the collapsed row —
   no expanding needed. Tapping a choice also selects the drug. */
function quickOptsHtml(m,kg,lb){
  if(kg===null)return"";
  if(!(m.type==="band"||m.type==="tab"||m.type==="multiband"))return"";
  const d=doseOptions(m,kg,lb);
  if(d.opts.length<2)return"";
  const s=st(m.id);
  const sel=(s.opt===null||s.opt<0||s.opt>=d.opts.length)?d.def:s.opt;
  return'<span class="qopts">'+d.opts.map((o,i)=>
    '<button type="button" class="qchip'+(s.opt!==-1&&i===sel?" on":"")+(o.isLabel?" lab":"")+'" '+
      'title="'+fmtMg(o.mg)+' mg'+(kg?' \u00b7 '+R2(o.mg/kg)+' mg/kg':'')+'" '+
      'onclick="event.stopPropagation();pickQuick(\''+m.id+'\','+i+')">'+
      tabsText(o.tabs)+'</button>').join("")+'</span>';}
function pickQuick(id,i){
  const s=st(id);s.opt=i;s.on=true;
  markCustom();redrawMed(id);buildOutput();}

function summaryInner(m,kg,lb){
  const q=doseSummary(m,kg,lb);
  let lab=labelDose(m);
  if(m.type==="weightText"&&lb!==null){const b=band(m.bandKey,lb);if(b)lab=b.text;}
  /* label dose leads; the milligram amount for this patient follows it */
  const showAmt=!q.dim&&q.dose&&q.dose!==lab;
  return(lab?'<span class="chip label">'+esc(lab)+'</span>':"")+
    (q.freq?'<span class="mfreq">'+esc(q.freq)+'</span>':"")+
    (showAmt?'<span class="chip dose">'+q.dose+'</span>':"")+
    (q.dim&&kg===null&&lab?'<span class="mfreq needwt">enter weight for mg</span>':"");}

/* editable mg/kg target — the label range is the default and stays one tap away */
function targetEditHtml(m,kg){
  const s=st(m.id),u=(m.unitDose||"mg")+"/kg";
  const lbl=m.hi>m.lo?m.lo+"–"+m.hi:String(m.lo);
  const val=curMgkg(m);
  return'<div class="dose-target'+(s.mgkg!==null?" custom":"")+'">'+
    '<span class="dt-lbl">Target</span>'+
    '<input class="dt-in" type="number" step="any" min="0" inputmode="decimal" value="'+val+'" '+
      'aria-label="Target dose in '+u+'" '+
      'onchange="setMgkg(\''+m.id+'\',this.value)" '+
      'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
    '<span class="dt-unit">'+u+'</span>'+
    (kg?'<span class="dt-eq">= '+fmtMg(val*kg)+' '+(m.unitDose||"mg")+'</span>':'')+
    (s.mgkg!==null
      ?'<button type="button" class="dt-reset" onclick="setMgkg(\''+m.id+'\',null)">↺ label '+lbl+'</button>'
      :'<span class="dt-note">label '+lbl+' '+u+'</span>')+
    '</div>';}

/* Custom dose, entered the way it is written on a label: strength in mg, then
   how many tablets, then the interval in hours. Quarter/half/three-quarter sit
   above the 1-2-3 row of the tablet keypad. */
/* Custom dose written the way it goes on a label: strength, how many, how
   often. A medication with no tablet strength (a powder measured in tsp) skips
   the strength box. Plain number fields: inputmode brings up the phone's own
   numeric keypad, and decimals cover volumes and fractions (0.5 prints as ½). */
function hasStrengthBox(m){
  return m.type==="band"||m.type==="tab"||m.type==="calc"||m.type==="multiband";}
function customOptHtml(m,kg){
  const s=st(m.id),unitName=m.unitName||"tab";
  const on=s.opt===-1;
  const strengthBox=hasStrengthBox(m)
    ?'<input class="cust-mg" type="number" step="any" min="0" inputmode="decimal" '+
       'placeholder="mg" aria-label="Strength of one '+escAttr(unitName)+' in mg" '+
       'value="'+(s.cMg===null?"":s.cMg)+'" '+
       'onfocus="pickCustom(\''+m.id+'\')" '+
       'oninput="setCustomMg(\''+m.id+'\',this.value)" '+
       'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
     '<span class="cx-u">mg:</span>'
    :"";
  return'<div class="opt cust'+(on?" on":"")+'">'+
    '<input type="radio" name="opt-'+m.id+'" id="rc'+m.id+'" '+(on?"checked":"")+
      ' onchange="pickCustom(\''+m.id+'\')">'+
    '<label for="rc'+m.id+'">Custom</label>'+
    '<span class="cx">'+strengthBox+
      '<input class="cust-n" type="number" step="any" min="0" inputmode="decimal" '+
        'placeholder="#" aria-label="Amount in '+escAttr(unitName)+'" '+
        'value="'+(s.cN===null?"":s.cN)+'" '+
        'onfocus="pickCustom(\''+m.id+'\')" '+
        'oninput="setCustomN(\''+m.id+'\',this.value)" '+
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
      '<span class="cx-u">'+esc(unitName)+' every</span>'+
      '<input class="cust-hr" type="number" step="1" min="1" inputmode="numeric" '+
        'placeholder="hrs" aria-label="Interval in hours" '+
        'value="'+(s.cHr===null?"":s.cHr)+'" '+
        'onfocus="pickCustom(\''+m.id+'\')" '+
        'oninput="setCustomHr(\''+m.id+'\',this.value)" '+
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur()}">'+
      '<span class="cx-u">hrs</span>'+
    '</span>'+
    '<span class="dmg" id="cmk-'+m.id+'">'+customMgkgText(m,kg)+'</span></div>';}
function customMgkgText(m,kg){
  const t=customTabs(m.id);
  if(!t)return"";
  const tot=t[0].mg*t[0].n;
  return"= "+fmtMg(tot)+" mg"+(kg?" \u00b7 "+R2(tot/kg)+" mg/kg":"");}

function medHtml(m,kg,lb){
  const s=st(m.id);
  let body="",chart="";
  if(m.type==="band"||m.type==="tab"||m.type==="multiband"){
    const d=doseOptions(m,kg,lb);
    if(d.msg)body+='<div class="warn">'+d.msg+'</div>';
    if(m.type!=="multiband")body+=targetEditHtml(m,kg);
    const sel=(s.opt===null||s.opt<0||s.opt>=d.opts.length)?d.def:s.opt;
    body+=d.opts.map((o,i)=>{
      const mgkg=kg&&m.type!=="multiband"?" · "+R2(o.mg/kg)+" mg/kg":"";
      const tag=m.type==="multiband"?""
        :o.isLabel?'<span class="ltag">Label</span>'
        :o.inRange?'<span class="ltag in">In range</span>'
        :o.pct===null?""
        :'<span class="ltag '+(o.pct<75||o.pct>133?"out":"pct")+'">'+o.pct+'% of target</span>';
      return'<div class="opt"><input type="radio" name="opt-'+m.id+'" id="r'+m.id+i+'" '+
        (s.opt!==-1&&sel===i?"checked":"")+' onchange="pickOpt(\''+m.id+'\','+i+')">'+
        '<label for="r'+m.id+i+'"><span>'+tabsText(o.tabs)+'</span>'+
        (o.mg?'<span class="dmg">= '+fmtMg(o.mg)+" mg"+mgkg+'</span>':"")+tag+'</label></div>';
    }).join("");
    body+=customOptHtml(m,kg);
    if(m.mlConc&&kg){
      const pk=perKg(m),lo2=pk.lo*kg/m.mlConc,hi2=pk.hi*kg/m.mlConc;
      body+='<div class="mnote">Liquid ('+m.mlConc+' mg/ml): '+(pk.hi>pk.lo?fmtMl(lo2)+"–"+fmtMl(hi2):fmtMl(lo2))+' ml</div>';}
    body+=freqHtml(m,s);
    chart=bandChartHtml(m,lb);
  } else if(m.type==="calc"){
    const pk=perKg(m),lo=kg===null?null:pk.lo*kg,hi=kg===null?null:pk.hi*kg,u=m.unitDose||"mg";
    body=targetEditHtml(m,kg);
    if(kg&&s.opt!==-1)
      body+='<div class="mnote">→ <strong>'+(pk.hi>pk.lo?fmtMg(lo)+"–"+fmtMg(hi):fmtMg(lo))+" "+u+'</strong> per dose</div>';
    body+=customOptHtml(m,kg);
    body+=freqHtml(m,s);
  } else if(m.type==="inj"){
    const mg=kg===null?null:m.lo*kg,ml=mg===null?null:mg/m.conc;
    body='<div class="mnote">'+m.lo+" mg/kg "+(mg?" → <strong>"+fmtMg(mg)+" mg = "+fmtMl(ml)+" ml</strong>":"")+'</div>';
  } else if(m.type==="injVolume"){
    const vol=s.volMl!==null?s.volMl:m.defaultMl;
    body='<div class="mnote">Click the volume chip to adjust (default: '+m.defaultMl+' ml).</div>';
  } else if(m.type==="fixed"){
    body='<div class="mnote">'+m.doseText+(m.extraNote?" · "+m.extraNote:"")+'</div>';
    body+=customOptHtml(m,kg);
    body+=freqHtml(m,s);
  } else if(m.type==="weightText"){
    const b=band(m.bandKey,lb);
    if(m.noteFn)body+='<div class="mnote">'+eval("("+m.noteFn+")")(kg,lb)+'</div>';
    body+=customOptHtml(m,kg);
    body+=freqHtml(m,s);
    chart=bandChartHtml(m,lb);
  } else if(m.type==="iver"){
    const ml=kg===null?null:kg*m.doseMid/m.conc;
    body='<div class="mnote">'+m.gen+(kg?" → typical draw <strong>"+fmtMl(ml)+" ml</strong>"+
      " (range "+fmtMl(kg*m.doseLo/m.conc)+"–"+fmtMl(kg*m.doseHi/m.conc)+" ml)":"")+
      ". "+m.protocol.charAt(0).toUpperCase()+m.protocol.slice(1)+"."+
      (m.ramp&&kg?" Ramp start ("+m.ramp+" mg/kg): <strong>"+fmtMl(kg*m.ramp/m.conc)+" ml</strong>.":"")+
      " Caution in ivermectin-sensitive (MDR1) breeds.</div>";
  } else if(m.type==="protocol"){
    body='<div class="mnote">'+evalFn(m.bodyFn)(kg,lb)+'</div>';
  }

  /* injVolume's chip is the dose entry itself, so it stays interactive */
  const head=m.type==="injVolume"
    ?chipHtml(m,kg,lb)
    :'<span class="msum" id="sum-'+m.id+'" title="Show dosing options" '+
      'onclick="toggleOpen(\''+m.id+'\')">'+summaryInner(m,kg,lb)+'</span>';
  return'<div class="med '+(s.on?"":"off")+(s.open?" open":"")+'" id="med-'+m.id+'">'+
    '<div class="mh">'+
    '<input type="checkbox" id="ck-'+m.id+'" '+(s.on?"checked":"")+
    ' onchange="toggleMed(\''+m.id+'\')">'+
    '<div class="mn"><label class="name" for="ck-'+m.id+'">'+m.name+'</label>'+
    (m.gen?'<span class="gen">· '+m.gen+'</span>':"")+'</div>'+
    head+quickOptsHtml(m,kg,lb)+
    '<button type="button" class="disc" aria-expanded="'+(s.open?"true":"false")+'" '+
      'aria-controls="mbody-'+m.id+'" aria-label="'+(s.open?"Collapse":"Expand")+' '+escAttr(m.name)+'" '+
      'onclick="toggleOpen(\''+m.id+'\')">▾</button>'+
    '</div>'+
    '<div class="mbody" id="mbody-'+m.id+'">'+
    '<div class="mb">'+body+'</div>'+
    (m.note?'<div class="med-note-box">'+m.note+'</div>':"")+
    chart+'</div></div>';}

  if(mode!=="discharge"){wrap.style.display="none";return;}
  wrap.style.display="block";

    '<div style="font-size:11.5px;color:var(--soft);margin-bottom:8px">'+
    'CLIENT INSTRUCTION BLOCKS — check to include. '+
    '"<code>{name}</code>" is replaced by the patient\'s name. '+
    'Start a line with • or - to print it as a bullet; leave a blank line between paragraphs.</div>'+
    blocks.map(b=>{
      const s=bk(b.id,b);
      let controls="";
      if(b.durationOptions){
        controls+='<select title="Withhold duration" onchange="setDur(\''+b.id+'\',this.selectedIndex)">'+
          b.durationOptions.map((d,i)=>'<option '+(s.dur===i?"selected":"")+'>'+d+'</option>').join("")+'</select>';}
      let textVal=s.text!==null?s.text:b.text;
      // show duration preview in textarea

        '</div></div>';
    }).join("");}


/* ================================================================
   PRESET ENGINE
================================================================ */
let activePreset=null;  // id of active preset, or null if custom/cleared

function clearAll(){
  // Reset all med and block state to defaults
  for(const k of Object.keys(S)) delete S[k];
  for(const k of Object.keys(BLK)) delete BLK[k];
  // Re-init block defaults from JSON
  for(const b of(C.dischargeBlocks||[]))bk(b.id,b);
  // Reset discharge title override
  if(C._origDischarge) C.discharge=C._origDischarge;
  activePreset=null;
  render();
  refreshPresetBtns();}

function applyPreset(pid){
  const presets=C.presets||[];
  const p=presets.find(x=>x.id===pid);
  if(!p)return;
  // Save original discharge title once
  if(!C._origDischarge)C._origDischarge=C.discharge;
  // Clear existing state
  for(const k of Object.keys(S))delete S[k];
  for(const k of Object.keys(BLK))delete BLK[k];
  // Re-init blocks to all-off, then apply preset
  for(const b of(C.dischargeBlocks||[]))BLK[b.id]={on:false,dur:0,text:null};
  // Apply meds
  for(const pm of p.meds){
    const s=st(pm.id);
    s.on=true;
    if(pm.opt!==undefined)s.opt=pm.opt;
    if(pm.mgkg!==undefined)s.mgkg=pm.mgkg;
    if(pm.cMg!==undefined){s.cMg=pm.cMg;s.opt=-1;}
    if(pm.cN!==undefined){s.cN=pm.cN;s.opt=-1;}
    if(pm.cHr!==undefined){s.cHr=pm.cHr;s.opt=-1;}
    if(pm.freq!==undefined)s.freq=pm.freq;}
  // Apply blocks
  for(const pb of p.blocks){
    const b=BLK[pb.id]||{};
    b.on=pb.on;
    if(pb.dur!==undefined)b.dur=pb.dur;
    if(pb.text!==undefined)b.text=pb.text;
    BLK[pb.id]=b;}
  // Override discharge title
  C.discharge=p.discharge||C._origDischarge;
  // Switch species to match preset if needed
  if(p.sp&&p.sp!==sp)setSp(p.sp);
  activePreset=pid;
  render();
  refreshPresetBtns();}

function markCustom(){
  // Called whenever user manually changes anything after a preset
  if(activePreset!==null){activePreset=null;refreshPresetBtns();}}

function refreshPresetBtns(){
  const bar=document.getElementById("preset-btns");
  if(!bar)return;
  const presets=(C.presets||[]).filter(p=>p.sp===sp);
  if(!presets.length){document.getElementById("preset-bar").style.display="none";return;}
  document.getElementById("preset-bar").style.display="block";
  const anyOn=Object.values(S).some(s=>s.on);
  bar.onclick=e=>{const b=e.target.closest('[data-pid]');if(b)applyPreset(b.dataset.pid);};
  bar.innerHTML=
    presets.map(p=>
      '<button class="pbtn'+(activePreset===p.id?" active":"")
      +'" data-pid="'+p.id+'" title="'+esc(p.desc||"")+'">'+esc(p.label)+'</button>'
    ).join("")+
    (anyOn||activePreset?
      '<div class="preset-divider"></div>'+
      (activePreset===null&&anyOn?
        '<button class="pbtn custom" onclick="" disabled title="Selections modified">✎ Custom</button>':'')
      +'<button class="pbtn clear" onclick="clearAll()">✕ Clear all</button>':"");}
/* ---- calculators: the sheet's own formulas, run on this patient ----
   Each calculator has its own inputs; the weight and species come from the
   header. Rows come back as cells; {h:...} is a section heading and
   {cols:[...]} a column header. */
const CALC={};
const calcFnCache={};
function calcFn(src){
  if(!calcFnCache[src])calcFnCache[src]=new Function("kg","lb","sp","v","return ("+src+")(kg,lb,sp,v)");
  return calcFnCache[src];}
function calcVals(c){
  const st=CALC[c.id]||(CALC[c.id]={});
  const v={};
  for(const i of (c.inputs||[])){
    const raw=st[i.id];
    v[i.id]=(raw!==undefined&&raw!=="")?parseFloat(raw):(i.default!==undefined?i.default:NaN);}
  return v;}
function calcTable(c,kg,lb){
  if(kg===null&&c.needsWeight!==false)
    return'<div class="calc-wait">Enter the patient\'s weight to run this.</div>';
  let rows;
  try{rows=calcFn(c.fn)(kg===null?NaN:kg,lb===null?NaN:lb,sp,calcVals(c));}
  catch(e){return'<div class="warn">'+esc(e.message)+'</div>';}
  let h='<table class="calc-t">';
  for(const r of rows){
    if(r&&r.h){h+='<tr class="ch"><td colspan="6">'+esc(r.h)+'</td></tr>';continue;}
    if(r&&r.cols){h+='<tr class="cc">'+r.cols.map(x=>'<th>'+esc(x)+'</th>').join("")+'</tr>';continue;}
    if(!Array.isArray(r))continue;
    const last=r.length-1;
    h+='<tr>'+r.map((x,i)=>{
      const num=typeof x==="number";
      return'<td'+(num?' class="n"':"")+(i===last&&r.length<6?' colspan="'+(6-last)+'"':"")+'>'+
        esc(num?String(x):x)+'</td>';}).join("")+'</tr>';}
  return h+'</table>';}
function calcHtml(c,kg,lb){
  const st=CALC[c.id]||(CALC[c.id]={});
  const inputs=(c.inputs||[]).map(i=>
    '<label class="ci"><span>'+esc(i.label)+'</span>'+
    '<input type="number" inputmode="decimal" step="'+(i.step||"any")+'" '+
      'value="'+(st[i.id]!==undefined?st[i.id]:(i.default!==undefined?i.default:""))+'" '+
      'oninput="setCalc(\''+c.id+'\',\''+i.id+'\',this.value)">'+
    (i.unit?'<span class="ci-u">'+esc(i.unit)+'</span>':"")+'</label>').join("");
  return'<div class="card calc" id="calccard-'+c.id+'">'+
    '<div class="grp-title">'+esc(c.title)+'</div>'+
    (c.sub?'<div class="calc-sub">'+esc(c.sub)+'</div>':"")+
    (inputs?'<div class="calc-in">'+inputs+'</div>':"")+
    '<div id="calc-'+c.id+'">'+calcTable(c,kg,lb)+'</div></div>';}
function calcsHtml(kg,lb){
  const cs=(C.calculators||[]);
  if(!cs.length)return"";
  return'<div class="grid calcgrid">'+cs.map(c=>calcHtml(c,kg,lb)).join("")+'</div>';}
function setCalc(id,inp,val){
  (CALC[id]||(CALC[id]={}))[inp]=val;
  const c=(C.calculators||[]).find(x=>x.id===id),el=document.getElementById("calc-"+id);
  if(c&&el)el.innerHTML=calcTable(c,getKg(),getLb());}

function hasNotes(){
  const n=C&&C.notes;
  if(!n)return false;
  if(Array.isArray(n))return n.length>0;
  if(n.grids)return n.grids.some(g=>g.rows&&g.rows.length);
  return Object.keys(n).length>0;}
/* A positioned grid reproduces the sheet: a cell spans rightward over the empty
   cells beside it, the way text overflows in Excel, so side-by-side blocks stay
   side by side and a paragraph in one column reads across the page. */
function gridHtml(g){
  const nc=Math.max(1,g.ncols||1);
  let h=(g.title?'<div class="sheet-title">'+esc(g.title)+'</div>':"")+
    '<div class="sheetwrap"><table class="sheet">';
  for(const row of g.rows){
    if(!row.length){h+='<tr class="gap"><td colspan="'+nc+'"></td></tr>';continue;}
    h+='<tr>';
    let col=0;
    for(let i=0;i<row.length;i++){
      const cell=row[i];
      if(cell.c>col)h+='<td class="e" colspan="'+(cell.c-col)+'"></td>';
      const next=i+1<row.length?row[i+1].c:nc;
      const span=Math.max(1,next-cell.c);
      h+='<td colspan="'+span+'"'+(cell.b?' class="b"':"")+'>'+esc(cell.t)+'</td>';
      col=cell.c+span;}
    h+='</tr>';}
  return h+'</table></div>';}
function notesPanelHtml(){
  const n=C&&C.notes;
  if(!hasNotes())return"";
  let items;
  if(Array.isArray(n))items=n.map(v=>'<div class="note-item">'+esc(v)+'</div>').join("");
  else if(n.grids)items=n.grids.map(gridHtml).join("");
  else items=Object.keys(n).map(k=>'<div class="note-item"><strong>'+esc(k)+':</strong> '+
       esc(n[k])+'</div>').join("");
  return'<div class="notes-panel wide" id="notes"><h3>Notes</h3>'+items+'</div>';}

/* ================================================================
   FULL PAGE RENDER
================================================================ */
function render(){
  if(!C)return;
  const kg=getKg(),lb=getLb();
  document.getElementById("kgshow").innerHTML=unit==="lb"
    ?"= <strong>"+(kg===null?"—":R2(kg))+"</strong> kg"
    :"= <strong>"+(lb===null?"—":Math.round(lb*10)/10)+"</strong> lb";
  /* A page whose whole job is one number puts it under the weight box rather
     than making the reader scroll for it. */
  const hc=document.getElementById("headercalc");
  if(hc){
    if(C.headerCalc){
      hc.hidden=false;
      hc.innerHTML='<span class="hc-lbl">'+esc(C.headerCalc.label)+'</span>'+
        '<span class="hc-val">'+(kg===null?"—":evalFn(C.headerCalc.fn)(kg,lb))+'</span>'+
        (C.headerCalc.unit?'<span class="hc-unit">'+esc(C.headerCalc.unit)+'</span>':"");
    }else hc.hidden=true;}

  // group meds by species then group name
  const groups={};
  for(const m of C.meds){
    if(m.sp!==sp)continue;
    (groups[m.grp]=groups[m.grp]||[]).push(m);}

  /* Notes are the source spreadsheet's own text. An array is rendered line for
     line with no headings added; the older object form keeps its keys. */
  const notesHtml=notesPanelHtml();

  const cards=Object.entries(groups).map(([grp,meds])=>

    '<div class="card"><div class="grp-title">'+grp+
    ' <span class="grp-tag">'+(sp==="dog"?"Dog":"Cat")+'</span></div>'+
    meds.map(m=>medHtml(m,kg,lb)).join("")+'</div>').join("");

  // output panel
  const outcard=`
  <div class="card wide" id="output" style="margin-top:18px">
    <div style="font-size:15px;font-weight:700;margin-bottom:10px">Generated Instructions</div>
    <div class="tabs">
      <button id="tab-rec" class="${mode==="record"?"on":""}" onclick="setMode('record')">Medical record</button>
      ${C.noDischarge?"":"<button id=\"tab-dis\" class=\""+( mode==="discharge"?"on":"")+" \" onclick=\"setMode('discharge')\">Discharge instructions</button>"}
    </div>
    <div id="blocks"></div>
    <div class="outhead">
      <div class="outmeta">Check medications above · output updates live · click inside to edit before copying or printing.</div>
    </div>
    <div class="out-wrap">
      <div id="outpreview" contenteditable="true" spellcheck="false"></div>
      <div class="out-actions">
        <button class="obtn p" onclick="copyRich()">Copy (rich text)</button>
        <button class="obtn s" onclick="copyPlain()">Copy (plain text)</button>
        <button class="obtn s" onclick="doPrint()">Print / PDF</button>
        <span class="copied" id="copiedmsg">Copied ✓</span>
      </div>
    </div>
  </div>`;

  const shown=C.meds.filter(m=>m.sp===sp);
  const viewbarHtml=shown.length?null:"";
  const nOpen=shown.filter(m=>st(m.id).open).length;
  const viewbar=
    '<div class="viewbar">'+
      '<span class="vb-label">'+shown.length+' medications'+
        (nOpen?' · '+nOpen+' expanded':' · overview')+'</span>'+
      '<div class="vb-btns">'+
        '<button type="button" class="vbtn" onclick="setAllOpen(false)">⊟ Collapse all</button>'+
        '<button type="button" class="vbtn" onclick="setAllOpen(true)">⊞ Expand all</button>'+
      '</div></div>';

  /* The weight field starts empty on every load so nothing carries over from the
     last patient, but the page is not gated: mg/kg doses read straight off and
     only the milligram amounts wait for a weight. */
  /* The weight box is right here in the banner — the first thing on the page
     and the first thing to do — rather than a notice pointing at the header. */
  const hdrWt=document.querySelector(".ctl.wt");
  if(hdrWt)hdrWt.style.display=(kg===null&&!C.noWeight)?"none":"";
  const wtBanner=(kg===null&&!C.noWeight)
    ?'<div class="wtbar">'+
       '<label class="wb-txt" for="wt2"><strong>Patient weight</strong>'+
       '<span class="wb-sub">mg/kg doses are shown below; the milligram amounts fill in once a weight is entered.</span></label>'+
       '<span class="wb-in">'+
         '<input id="wt2" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.0" '+
           'aria-label="Patient weight in '+unit+'" '+
           'oninput="mirrorWt(this.value)" '+
           'onchange="commitWt()" '+
           'onkeydown="if(event.key===\'Enter\'){event.preventDefault();commitWt()}">'+
         '<span class="wb-u">'+unit+'</span>'+
         '<button type="button" class="wb-btn" onclick="commitWt()">Go</button>'+
       '</span>'+
     '</div>':"";

  /* Drugs and doses first, then the discharge/record output, then the source
     notes at the foot of the page. */
  document.getElementById("main").innerHTML=
    wtBanner+(viewbarHtml===""?"":viewbar)+
    (cards?'<div class="grid">'+cards+'</div>':"")+
    calcsHtml(kg,lb)+
    (shown.length?outcard:"")+
    (notesHtml?'<div class="grid notesgrid">'+notesHtml+'</div>':"");
  renderBlocks();
  buildOutput();
  refreshPresetBtns();
  const nj=document.getElementById("notesjump");
  if(nj)nj.style.display=hasNotes()?"":"none";}

/* ================================================================
   EVENT HANDLERS
================================================================ */
/* redraw one medication in place — cheaper than a full render and it keeps
   the rest of the page (and the scroll position) exactly where it was */
function redrawMed(id){
  const m=C.meds.find(x=>x.id===id),el=document.getElementById("med-"+id);
  if(m&&el)el.outerHTML=medHtml(m,getKg(),getLb());}
/* keep the one-line summary honest while the row is open */
function refreshSum(id){
  const m=C.meds.find(x=>x.id===id),el=document.getElementById("sum-"+id);
  if(m&&el)el.innerHTML=summaryInner(m,getKg(),getLb());}

function toggleMed(id){const s=st(id);s.on=!s.on;s.open=s.on;
  redrawMed(id);markCustom();buildOutput();}
function toggleOpen(id){const s=st(id);s.open=!s.open;redrawMed(id);}
function setAllOpen(v){
  for(const m of C.meds)if(m.sp===sp)st(m.id).open=v;
  render();}
function pickOpt(id,i){st(id).opt=i;custRow(id,false);markCustom();buildOutput();refreshSum(id);}
/* the custom row is toggled in place — a full re-render would blur the field
   the clinician is typing into */
function custRow(id,on){
  const med=document.getElementById("med-"+id);
  if(!med)return;
  const row=med.querySelector(".opt.cust");
  if(row)row.classList.toggle("on",on);}
function pickCustom(id){
  const s=st(id),r=document.getElementById("rc"+id);
  if(r)r.checked=true;
  custRow(id,true);
  if(s.opt===-1)return;
  s.opt=-1;markCustom();buildOutput();refreshSum(id);}
function setCustomMg(id,v){
  const s=st(id),n=parseFloat(v);
  s.cMg=(isFinite(n)&&n>0)?Math.round(n*1000)/1000:null;
  s.opt=-1;custRow(id,true);
  const m=C.meds.find(x=>x.id===id),el=document.getElementById("cmk-"+id);
  if(m&&el)el.textContent=customMgkgText(m,getKg());
  markCustom();buildOutput();refreshSum(id);}
function setCustomN(id,v){
  const s=st(id),n=v===null?null:parseFloat(v);
  s.cN=(n!==null&&isFinite(n)&&n>0)?n:null;
  s.opt=-1;custRow(id,true);
  const m=C.meds.find(x=>x.id===id),el=document.getElementById("cmk-"+id);
  if(m&&el)el.textContent=customMgkgText(m,getKg());
  markCustom();buildOutput();refreshSum(id);}
function setCustomHr(id,v){
  const s=st(id),n=parseFloat(v);
  s.cHr=(isFinite(n)&&n>0)?n:null;
  s.opt=-1;custRow(id,true);
  markCustom();buildOutput();refreshSum(id);}

function setCustomFreq(id,v){
  st(id).cFreq=v;markCustom();redrawMed(id);buildOutput();}
/* retarget mg/kg — options re-bracket around the new target and the
   selection goes back to automatic so it follows it */
function setMgkg(id,v){
  const s=st(id);
  if(v===null||v===""){s.mgkg=null;}
  else{const n=parseFloat(v);if(!isFinite(n)||n<=0)return;s.mgkg=Math.round(n*1000)/1000;}
  s.opt=null;markCustom();render();}
function pickFreq(id,i){st(id).freq=i;markCustom();buildOutput();refreshSum(id);}
function setVol(id,el){
  const v=parseFloat(el.textContent);
  st(id).volMl=isFinite(v)&&v>0?Math.round(v*100)/100:(C.meds.find(m=>m.id===id)||{}).defaultMl||null;
  el.textContent=st(id).volMl;buildOutput();}
/* a preset is a bulk choice, so its medications land collapsed — the overview
   is what you want to read after applying one */
function toggleBlk(id){const b=BLK[id];if(b)b.on=!b.on;markCustom();renderBlocks();buildOutput();}
function setDur(id,i){const b=BLK[id];if(b)b.dur=i;markCustom();renderBlocks();buildOutput();}
function editBlk(id,v){const b=BLK[id];if(b)b.text=v;markCustom();buildOutput();}
function setSp(s){sp=s;
  document.body.classList.toggle("dog",s==="dog");
  document.body.classList.toggle("cat",s==="cat");
  document.getElementById("btn-dog").classList.toggle("on",s==="dog");
  document.getElementById("btn-cat").classList.toggle("on",s==="cat");
  render();}
function setU(u){
  const wt=document.getElementById("wt");const v=parseFloat(wt.value);
  if(isFinite(v)&&v>0&&u!==unit)wt.value=u==="kg"?R2(v/2.2):Math.round(v*2.2*10)/10;
  unit=u;
  document.getElementById("btn-lb").classList.toggle("on",u==="lb");
  document.getElementById("btn-kg").classList.toggle("on",u==="kg");
  render();}
function setMode(m){
  if(m==="discharge"&&C&&C.noDischarge)m="record";
  mode=m;renderBlocks();buildOutput();
  const tr=document.getElementById("tab-rec"),td=document.getElementById("tab-dis");
  if(tr)tr.classList.toggle("on",m==="record");
  if(td)td.classList.toggle("on",m==="discharge");}
/* every condition page can jump straight to the finished sheet */
function goNotes(){
  const el=document.getElementById("notes");
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
function focusWeight(){
  const w=document.getElementById("wt2")||document.getElementById("wt");
  if(!w)return;
  w.scrollIntoView({block:"nearest"});
  w.focus();w.select();}
/* the banner field mirrors into the header field; the page re-renders when
   the entry is finished so the field is not pulled away mid-typing */
function mirrorWt(v){const w=document.getElementById("wt");if(w)w.value=v;}
function commitWt(){
  const w=document.getElementById("wt");
  if(w)w.classList.toggle("needed",getKg()===null);
  render();}
function goOutput(m){
  setMode(m);
  const el=document.getElementById("output");
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

/* ================================================================
   BOOTSTRAP — load condition JSON from URL param
================================================================ */
async function boot(){
  const params=new URLSearchParams(location.search);
  const cid=params.get("c")||params.get("condition")||"skin";
  try{
    const r=await fetch("conditions/"+cid+".json");
    if(!r.ok)throw new Error("HTTP "+r.status);
    C=await r.json();
    // Initialise BLK state from JSON defaults
    for(const b of(C.dischargeBlocks||[]))bk(b.id,b);
    document.getElementById("pagetitle").textContent=C.title;
    if(C.noDischarge)document.getElementById("cb-dis").style.display="none";
    if(!C.meds.length)document.querySelector(".countbar").style.display="none";
    if(!C.meds.length&&(C.calculators||[]).length)C.noDischarge=true;
    /* A condition that only has feline medications must not open on Dog and
       show an empty page. Start on a species that actually has something. */
    const anyCalc=(C.calculators||[]).length>0;
    const have={dog:C.meds.some(m=>m.sp==="dog")||(anyCalc&&(C.species||[]).includes("dog")),
                cat:C.meds.some(m=>m.sp==="cat")||(anyCalc&&(C.species||[]).includes("cat"))};
    for(const k of["dog","cat"]){
      const b=document.getElementById("btn-"+k);
      if(b){b.disabled=!have[k];b.title=have[k]?"":"No "+k+" medications in this condition";}}
    if(!have[sp]&&have[sp==="dog"?"cat":"dog"])sp=sp==="dog"?"cat":"dog";
    document.body.classList.toggle("dog",sp==="dog");
    document.body.classList.toggle("cat",sp==="cat");
    document.getElementById("btn-dog").classList.toggle("on",sp==="dog");
    document.getElementById("btn-cat").classList.toggle("on",sp==="cat");
    document.title=C.title+" — Dosing & Discharge";
    document.getElementById("wt").addEventListener("input",render);
    document.getElementById("pname").addEventListener("input",buildOutput);
    render();
    refreshPresetBtns();
    if(!C.noWeight)document.getElementById("wt").classList.add("needed");
    document.getElementById("wt").addEventListener("input",()=>{
      document.getElementById("wt").classList.toggle("needed",getKg()===null);});
    if(!C.noWeight&&!TOUCH)focusWeight();
  }catch(e){
    document.getElementById("main").innerHTML=
      '<div class="err">Could not load condition data: '+esc(String(e))+
      '<br><br><a href="index.html">← Back to conditions list</a></div>';}}

/* compact the sticky header once the page is scrolled (phone) */
let _sc=false;
addEventListener("scroll",()=>{
  const now=window.scrollY>70;
  if(now!==_sc){_sc=now;document.body.classList.toggle("scrolled",now);}
},{passive:true});

boot();
</script>
